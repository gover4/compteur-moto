/* insights: each rule needs a minimum sample and states it; nothing is shown without enough data */
function anaIns(){
  const out = [], ALL = services.slice(), today = new Date();
  const add = (txt, basis, tone) => out.push(`<div class="ins ${tone || ''}"><div>${txt}</div><small>${basis}</small></div>`);
  const pct = (a, b) => Math.round((a / b - 1) * 100);
  const wkStart = n => { const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (today.getDay() + 6) % 7 - 7 * n); return dayKey(d.getTime()); };
  // 1. best weekday over the last 8 weeks
  const L8 = ALL.filter(x => x.date >= wkStart(8));
  if(L8.length >= 6){
    const wd = JOURS_W.map(() => ({ca: 0, n: 0})); L8.forEach(x => { const i = (keyDate(x.date).getDay() + 6) % 7; wd[i].ca += split(x).ca; wd[i].n++; });
    const best = wd.map((x, i) => ({i, v: x.n ? x.ca / x.n : 0, n: x.n})).filter(x => x.n >= 2).sort((a, b) => b.v - a.v)[0];
    if(best) add(`Ton jour le plus rentable : <b>${JOURS_L[(best.i + 1) % 7]}</b> (${dt3(best.v)} DT en moyenne).`, `${L8.length} services sur les 8 dernières semaines`);
  }
  // 2. DT per hour, last complete week vs the week before
  const w1 = ALL.filter(x => x.date >= wkStart(1) && x.date < wkStart(0)), w2 = ALL.filter(x => x.date >= wkStart(2) && x.date < wkStart(1));
  const rate = L => { const a = agg(L); return a.min > 0 ? a.ca / (a.min / 60) : 0; };
  if(w1.length >= 2 && w2.length >= 2 && rate(w2) > 0){ const v = pct(rate(w1), rate(w2)); add(`Ton revenu par heure ${v === 0 ? 'est <b>stable</b>' : (v > 0 ? 'a augmenté' : 'a baissé') + ' de <b>' + Math.abs(v) + ' %</b>'} la semaine dernière (${dt3(rate(w1))} contre ${dt3(rate(w2))} DT/h).`, `${w1.length} et ${w2.length} services`, v >= 0 ? 'good' : 'bad'); }
  // 3. empty km share, last 30 days
  const d30 = dayKey(today.getTime() - 29 * 864e5), K = ALL.filter(x => x.date >= d30 && hasKm(x)).map(x => split(x)).filter(x => x.km > 0 && x.paidKm > 0);
  if(K.length >= 3){ const kr = sumBy(K, x => x.km), kp = sumBy(K, x => x.paidKm), e = Math.round(Math.max(0, kr - kp) / kr * 100); add(`Les km à vide représentent <b>${e} %</b> de ta distance.`, `${K.length} services des 30 derniers jours, ${km(kr)} km`, e > 50 ? 'bad' : ''); }
  // 4. last 10 shifts vs previous 10
  if(ALL.length >= 20){ const a = agg(ALL.slice(-10)), b = agg(ALL.slice(-20, -10)), v = pct(a.ca / 10, b.ca / 10); add(`Tes 10 derniers services ont rapporté <b>${Math.abs(v)} % ${v >= 0 ? 'de plus' : 'de moins'}</b> que les 10 précédents (${dt3(a.ca / 10)} contre ${dt3(b.ca / 10)} DT par service).`, '20 derniers services', v >= 0 ? 'good' : 'bad'); }
  // 5. fuel cost per km, this month vs last month
  const mo = dayKey(today.getTime()).slice(0, 7), pm = dayKey(new Date(today.getFullYear(), today.getMonth() - 1, 1).getTime()).slice(0, 7);
  const fpk = m2 => { const kmM = sumBy(ALL.filter(x => x.date.slice(0, 7) === m2 && hasKm(x)), x => split(x).km), f = sumBy(mexp().filter(e => e.cat === 'carb' && e.date.slice(0, 7) === m2), e => e.amt); return kmM >= 100 && f > 0 ? f / kmM : 0; };
  if(fpk(mo) && fpk(pm)){ const v = pct(fpk(mo), fpk(pm)); add(`Ton coût d'essence par km a ${v >= 0 ? 'augmenté' : 'baissé'} de <b>${Math.abs(v)} %</b> (${dt3(fpk(mo))} contre ${dt3(fpk(pm))} DT/km).`, 'ce mois-ci et le mois dernier', v > 0 ? 'bad' : 'good'); }
  // 6. best hour (meter rides, last 60 days)
  const C60 = trips.filter(c => c.ts >= today.getTime() - 60 * 864e5);
  if(C60.length >= 20){ const hr = {}; C60.forEach(c => { const k = new Date(c.start || c.ts).getHours(); hr[k] = (hr[k] || 0) + paidOf(c); }); const bh = Object.entries(hr).sort((a, b) => b[1] - a[1])[0]; add(`Ton heure la plus rentable : <b>${bh[0]} h – ${+bh[0] + 1} h</b> (${dt3(bh[1])} DT).`, `${C60.length} courses des 60 derniers jours`); }
  // 7. how clients use the price range
  const RG = C60.filter(c => c.lo != null && c.hi != null);
  if(RG.length >= 10){ const t = RG.filter(c => paidOf(c) > c.lo + 0.0005).length; add(`<b>${Math.round(t / RG.length * 100)} %</b> de tes clients laissent un pourboire au-dessus du prix minimum.`, `${RG.length} courses des 60 derniers jours`); }
  // 8. overspent reserves
  ledger('all').res.filter(x => x.bal < -0.5).forEach(x => add(`La réserve <b>${POT_INFO[x.k][0]}</b> est dépassée de ${dt3(-x.bal)} DT : tu as dépensé plus que prévu.`, 'depuis le début', 'bad'));
  return `<div class="card"><div class="lbl2">Ce que disent tes chiffres</div><div style="margin-top:8px">${out.length ? out.join('') : '<div class="hint">Pas encore assez de données. Les conseils apparaissent quand il y a assez de services et de courses pour être fiables.</div>'}</div></div>
    <div class="hint">Calculés uniquement à partir de tes services, courses et dépenses enregistrés.</div>`;
}

/* ====================================================================
   Statistiques
   ==================================================================== */
let statPer = '30';
const PERIODS = [['7', '7 jours'], ['30', '30 jours'], ['month', 'Ce mois'], ['all', 'Tout']];
const JOURS_W = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const MOIS_C = ['janv', 'févr', 'mars', 'avr', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];
function liveShift(){
  if(!cur) return null;
  return {id: 'live', live: true, date: dayKey(cur.t0), t0: cur.t0, t1: null, startKm: null, endKm: null,
    workMin: cur.endAt ? (cur.workMin || 0) : Math.round(workMs(cur, Date.now()) / 60000), rides: cur.rides, cfg: {...R}, todo: true};
}
const withLive = () => { const L = liveShift(); return L ? services.concat([L]) : services; };
function statRange(per){
  const now = new Date(), today = dayKey(now.getTime());
  if(per === 'month') return {from: today.slice(0, 7) + '-01', to: today};
  if(per === 'year') return {from: today.slice(0, 4) + '-01-01', to: today};
  if(per === 'all'){
    let from = today;
    let to = today;
    withLive().forEach(s => { if(s.date < from) from = s.date; if(s.date > to) to = s.date; });
    trips.forEach(c => { const k = dayKey(c.ts); if(k < from) from = k; if(k > to) to = k; });
    return {from, to};
  }
  return {from: dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - (+per - 1)).getTime()), to: today};
}
function prevRange(r){
  const a = keyDate(r.from), b = keyDate(r.to), n = Math.round((b - a) / 864e5) + 1;
  return {from: dayKey(new Date(a.getFullYear(), a.getMonth(), a.getDate() - n).getTime()), to: dayKey(new Date(a.getFullYear(), a.getMonth(), a.getDate() - 1).getTime())};
}
const inR = (k, r) => k >= r.from && k <= r.to;
const trend = (a, b) => { if(!(b > 0)) return ''; const v = Math.round((a / b - 1) * 100); return `<small class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '▲' : '▼'} ${Math.abs(v)} %</small>`; };
const srow = (k, v) => `<div class="srow"><span>${k}</span><b class="num">${v}</b></div>`;
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
function bars(list, labelEvery = 1){
  const max = Math.max(1e-9, ...list.map(x => x.v));
  const best = list.reduce((b, x, i) => x.v > (list[b] ? list[b].v : -1) ? i : b, -1);
  return `<div class="hbars">${list.map((x, i) => `<div class="c ${i === best && x.v > 0 ? 'best' : ''}" data-tip="${esc((x.tl || x.l) + ' : ' + (x.tip || dt3(x.v)))}"><div class="ar"><i style="height:${x.v > 0 ? Math.max(3, x.v / max * 100) : 0}%">${x.v2 != null && x.v > 0 ? `<em style="height:${Math.min(100, x.v2 / x.v * 100)}%"></em>` : ''}</i></div><span>${i % labelEvery === 0 ? x.l : ''}</span></div>`).join('')}</div>`;
}

function renderStats(){
  const m = $('statsBody'), r = statRange(statPer), ALL = withLive();
  // trends compare complete days only (today is still going on)
  const today0 = dayKey(Date.now()), yd = new Date(); yd.setDate(yd.getDate() - 1);
  const rc = r.to === today0 ? {from: r.from, to: dayKey(yd.getTime())} : r, pr = prevRange(rc);
  const S = ALL.filter(s => inR(s.date, r)), SC = ALL.filter(s => inR(s.date, rc)), SP = ALL.filter(s => inR(s.date, pr));
  const C = trips.filter(c => inR(dayKey(c.ts), r));              // rides measured by the meter
  const head = `<div class="seg2">${PERIODS.map(([k, l]) => `<button data-per="${k}" class="${statPer === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const bindPer = () => m.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { statPer = b.dataset.per; renderStats(); });
  if(!S.length && !C.length){
    m.innerHTML = head + `<div class="card empty">Pas encore de données pour cette période.<br>Les statistiques se remplissent avec tes courses et tes services.</div>`;
    bindPer(); return;
  }
  const A = agg(S), AC = agg(SC), AP = agg(SP), cmp = statPer !== 'all' && rc.from <= rc.to && SC.length > 0 && SP.length > 0;
  const mine = A.save + A.free, h = A.min / 60, days = new Set(S.map(s => s.date)).size;
  const SS = S.map(s => ({s, r: split(s)}));
  let html = head;

  // ---- key figures
  html += `<div class="kpis">
    <div class="kpi"><div class="lbl2">Chiffre d'affaires</div><b class="num">${dt3(A.ca)}</b>${cmp ? trend(AC.ca, AP.ca) : ''}</div>
    <div class="kpi"><div class="lbl2">Pour toi</div><b class="num g">${dt3(mine)}</b>${cmp ? trend(AC.save + AC.free, AP.save + AP.free) : ''}</div>
    <div class="kpi"><div class="lbl2">Courses</div><b class="num">${A.rides}</b>${cmp ? trend(AC.rides, AP.rides) : ''}</div>
    <div class="kpi"><div class="lbl2">Pourboires</div><b class="num y">${dt3(A.tips)}</b>${cmp ? trend(AC.tips, AP.tips) : ''}</div>
    <div class="kpi"><div class="lbl2">Km roulés</div><b class="num">${km(A.km)}</b>${cmp && !AC.noKm && !AP.noKm ? trend(AC.km, AP.km) : A.noKm ? `<small class="mut">${A.noKm} service${A.noKm > 1 ? 's' : ''} sans km</small>` : ''}</div>
    <div class="kpi"><div class="lbl2">Temps de travail</div><b class="num">${durMin(A.min)}</b>${cmp ? trend(AC.min, AP.min) : ''}</div>
  </div>${cmp ? `<div class="hint" style="margin:-4px 4px 12px">▲▼ ${shortDay(rc.from)} – ${rc.to === r.to ? shortDay(rc.to) : 'hier'}, comparé à ${shortDay(pr.from)} – ${shortDay(pr.to)}.</div>` : ''}${cur ? `<div class="hint" style="margin:-4px 4px 12px">Le service en cours est compté (provisoire).</div>` : ''}`;

  // ---- averages
  if(S.length) html += `<div class="card"><div class="lbl2">Moyennes</div><div style="margin-top:6px">
    ${srow('Par jour travaillé', `${dt3(A.ca / days)} DT <span class="mut">· pour toi ${dt3(mine / days)}</span>`)}
    ${srow('Par course', A.rides ? dt3(A.ca / A.rides) + ' DT' : '—')}
    ${srow('Par heure de travail', h > 0 ? `${dt3(A.ca / h)} DT <span class="mut">· pour toi ${dt3(mine / h)}</span>` : '—')}
    ${srow('Par km roulé', A.km > 0 ? dt3(A.kmCa / A.km) + ' DT' : '—')}
    ${srow('Courses par heure', h > 0 ? (A.rides / h).toFixed(1) : '—')}
    ${srow('Courses par jour travaillé', (A.rides / days).toFixed(1))}
    ${srow('Jours travaillés', days + ' · ' + A.n + ' service' + (A.n > 1 ? 's' : ''))}
  </div></div>`;

  // ---- revenue per day (or per month for "Tout")
  if(S.length){
    let list, title;
    if(statPer === 'all'){
      const months = []; const a = keyDate(r.from), b = keyDate(r.to);
      for(let d = new Date(a.getFullYear(), a.getMonth(), 1); d <= b; d.setMonth(d.getMonth() + 1)) months.push(dayKey(d.getTime()).slice(0, 7));
      list = months.slice(-12).map(mk => { const x = agg(S.filter(s => s.date.slice(0, 7) === mk)); return {l: MOIS_C[+mk.slice(5) - 1], v: x.ca, v2: x.save + x.free}; });
      title = 'Chiffre d\'affaires par mois';
    } else {
      list = []; const a = keyDate(r.from), b = keyDate(r.to);
      for(let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)){ const k = dayKey(d.getTime()), x = agg(S.filter(s => s.date === k)); list.push({l: d.getDate(), v: x.ca, v2: x.save + x.free, k}); }
      title = 'Chiffre d\'affaires par jour';
    }
    const best = list.reduce((b, x) => x.v > b.v ? x : b, {v: 0});
    html += `<div class="card"><div class="flexb"><div class="lbl2">${title}</div><span class="num mut" style="font-size:13px">${best.v ? 'record ' + dt3(best.v) : ''}</span></div>
      ${bars(list, list.length > 16 ? 5 : 1)}
      <div class="legend"><span><i style="background:#3a3020"></i>Chiffre d'affaires</span><span><i style="background:var(--save)"></i>Pour toi</span><span><i style="background:var(--amber)"></i>Meilleur</span></div></div>`;
  }

  // ---- km with a client vs empty km (the rider's main worry)
  const K = SS.filter(x => hasKm(x.s) && x.r.km > 0 && x.r.paidKm > 0);
  if(K.length){
    const kr = sum(K.map(x => x.r.km)), kp = sum(K.map(x => x.r.paidKm)), pc = kr > 0 ? Math.min(100, Math.round(kp / kr * 100)) : 0;
    const perPaid = kp > 0 ? (REAL.fuel + REAL.maint) * kr / kp : 0;
    html += `<div class="card"><div class="lbl2">Km avec client et km à vide</div>
      <div class="empty-km" style="margin-top:12px"><i style="width:${pc}%"></i></div>
      <div class="flexb" style="font-size:13.5px"><span class="g">${pc} % avec client · ${kp.toFixed(0)} km</span><span style="color:#ff8a7a">${Math.max(0, kr - kp).toFixed(0)} km à vide</span></div>
      <div style="margin-top:8px">${srow('Km roulés (compteur de la moto)', km(kr) + ' km')}
      ${srow('Essence + entretien par km payé', '≈ ' + dt3(perPaid) + ' DT')}
      ${srow('Ce que paie un km avec client', kp > 0 ? dt3(sum(K.flatMap(x => x.s.rides.filter(q => q.km != null).map(q => q.p))) / kp) + ' DT' : '—')}</div>
      <div class="hint">Les km à vide (retour au centre-ville, recherche de clients) coûtent de l'essence et de l'entretien : c'est le prix au km qui doit les payer.${K.length < S.length ? ` Calculé sur ${K.length} service${K.length > 1 ? 's' : ''} avec le compteur.` : ''}</div></div>`;
  }

  // ---- best days of the week
  if(S.length){
    const wd = JOURS_W.map(() => ({ca: 0, days: new Set()}));
    S.forEach(s => { const i = (keyDate(s.date).getDay() + 6) % 7, x = split(s); wd[i].ca += x.ca; wd[i].days.add(s.date); });
    const list = wd.map((x, i) => ({l: JOURS_W[i], v: x.days.size ? x.ca / x.days.size : 0}));
    const bi = list.reduce((b, x, i) => x.v > list[b].v ? i : b, 0);
    html += `<div class="card"><div class="lbl2">Meilleurs jours de la semaine</div>${bars(list)}
      <div class="hint">En moyenne par jour travaillé.${list[bi].v > 0 ? ` Ton meilleur jour : <b style="color:var(--fg)">${JOURS_L[(bi + 1) % 7]}</b> (${dt3(list[bi].v)} DT).` : ''}</div></div>`;
  }

  // ---- busiest hours (meter rides)
  if(C.length){
    const hr = Array.from({length: 24}, () => ({n: 0, dt: 0}));
    C.forEach(c => { const x = hr[new Date(c.start || c.ts).getHours()]; x.n++; x.dt += paidOf(c); });
    let a = hr.findIndex(x => x.n), b = 23 - [...hr].reverse().findIndex(x => x.n);
    a = Math.min(a, 6); b = Math.max(b, 22);
    const list = hr.slice(a, b + 1).map((x, i) => ({l: (a + i) + 'h', v: x.n}));
    const bh = hr.reduce((bi, x, i) => x.n > hr[bi].n ? i : bi, 0);
    html += `<div class="card"><div class="lbl2">Heures les plus actives</div>${bars(list, 3)}
      <div class="hint">Courses du compteur par heure de départ. Le plus de courses : <b style="color:var(--fg)">${bh} h – ${bh + 1} h</b> (${hr[bh].n} course${hr[bh].n > 1 ? 's' : ''}, ${dt3(hr[bh].dt)} DT).</div></div>`;
  }

  // ---- the rides themselves
  if(C.length){
    const D = C.filter(c => c.distKm != null);
    const B = [[0, 2, '< 2 km'], [2, 4, '2 – 4 km'], [4, 6, '4 – 6 km'], [6, 10, '6 – 10 km'], [10, 1e9, '10 km +']].map(([lo, hi, l]) => {
      const L = D.filter(c => +c.distKm >= lo && +c.distKm < hi); return {l, n: L.length, avg: avg(L.map(paidOf))};
    });
    const maxN = Math.max(1, ...B.map(x => x.n));
    html += `<div class="card"><div class="lbl2">Tes courses (compteur)</div><div style="margin-top:6px">
      ${srow('Courses mesurées', C.length)}
      ${srow('Distance moyenne', D.length ? avg(D.map(c => +c.distKm)).toFixed(1) + ' km' : '—')}
      ${srow('Durée moyenne', Math.round(avg(C.map(c => +c.durMin || 0))) + ' min')}
      ${srow('Attente moyenne', avg(C.map(c => +c.waitMin || 0)).toFixed(1) + ' min')}
      ${srow('Montant moyen reçu', dt3(avg(C.map(paidOf))) + ' DT')}</div>
      <div class="lbl2" style="margin-top:14px">Par distance</div>
      ${B.map(x => `<div class="brow"><span>${x.l}</span><div class="btrack"><i style="width:${x.n / maxN * 100}%"></i></div><span class="num">${x.n} · ${x.n ? dt3(x.avg) : '—'}</span></div>`).join('')}
      <div class="hint">Nombre de courses · montant moyen reçu.</div></div>`;
  }

  // ---- how clients use the price range (tips)
  const RG = C.filter(c => c.lo != null && c.hi != null);
  if(RG.length){
    const atMin = RG.filter(c => Math.abs(paidOf(c) - c.lo) <= 0.0005).length, tipped = RG.filter(c => paidOf(c) > c.lo + 0.0005);
    const under = RG.filter(c => paidOf(c) < c.lo - 0.0005);
    const wide = RG.filter(c => c.hi - c.lo > 0.0005), posAvg = wide.length ? avg(wide.map(c => Math.max(0, Math.min(1, (paidOf(c) - c.lo) / (c.hi - c.lo))))) : 0;
    const tipsT = sum(tipped.map(c => paidOf(c) - c.lo)), bigTip = tipped.reduce((b, c) => Math.max(b, paidOf(c) - c.lo), 0);
    const pctOf = n => Math.round(n / RG.length * 100) + ' %';
    html += `<div class="card"><div class="lbl2">La fourchette de prix</div>
      ${wide.length ? `<div class="rgbar" style="margin-top:12px"><i style="left:${posAvg * 100}%"></i></div>
      <div class="flexb" style="font-size:12.5px;color:var(--mut)"><span>prix min</span><span>prix max</span></div>
      <div class="hint" style="margin-top:6px">En moyenne, les clients paient <b style="color:var(--fg)">${Math.round(posAvg * 100)} %</b> de la fourchette au-dessus du minimum.</div>` : ''}
      <div style="margin-top:8px">${srow('Payé au prix minimum', pctOf(atMin))}
      ${srow('Avec pourboire', pctOf(tipped.length))}
      ${srow('Pourboires reçus', dt3(tipsT) + ' DT')}
      ${srow('Plus gros pourboire', bigTip > 0 ? dt3(bigTip) + ' DT' : '—')}
      ${under.length ? srow('En dessous du minimum', pctOf(under.length) + ' · −' + dt3(sum(under.map(c => c.lo - paidOf(c)))) + ' DT') : ''}</div></div>`;
  }

  // ---- where the money went
  if(S.length && A.ca > 0){
    const tot = {fuel: sum(SS.map(x => x.r.fuel))};
    POTS.forEach(p => { tot[p.k] = sum(SS.map(x => x.r.pots.find(q => q.k === p.k).amt)); });
    const rows = [{k: 'fuel', name: 'Carburant', color: 'var(--fuel)'}, ...POTS];
    html += `<div class="card"><div class="lbl2">Où est allé l'argent</div>
      <div class="bar">${rows.map(p => tot[p.k] > 0 ? `<i style="width:${tot[p.k] / A.ca * 100}%;background:${p.color}"></i>` : '').join('')}</div>
      ${rows.map(p => `<div class="ln"><span class="sw" style="background:${p.color}"></span><div class="t">${p.name}</div><div class="v num">${dt3(tot[p.k])}</div></div>`).join('')}</div>`;
  }

  // ---- records of the period
  const rec = [];
  if(S.length){
    const byDay = {}; SS.forEach(x => { byDay[x.s.date] = (byDay[x.s.date] || 0) + x.r.ca; });
    const bd = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];
    if(bd) rec.push(['Meilleure journée', `${dt3(bd[1])} DT <span class="mut">· ${shortDay(bd[0])}</span>`]);
    const bh = SS.filter(x => x.s.workMin >= 60).sort((a, b) => b.r.ca / b.s.workMin - a.r.ca / a.s.workMin)[0];
    if(bh) rec.push(['Meilleur rendement', `${dt3(bh.r.ca / bh.s.workMin * 60)} DT/h <span class="mut">· ${shortDay(bh.s.date)}</span>`]);
    const lw = SS.slice().sort((a, b) => b.s.workMin - a.s.workMin)[0];
    rec.push(['Plus long service', `${durMin(lw.s.workMin)} <span class="mut">· ${shortDay(lw.s.date)}</span>`]);
    const mr = SS.slice().sort((a, b) => b.s.rides.length - a.s.rides.length)[0];
    rec.push(['Plus de courses en un service', `${mr.s.rides.length} <span class="mut">· ${shortDay(mr.s.date)}</span>`]);
  }
  if(C.length){
    const lr = C.slice().sort((a, b) => (+b.distKm || 0) - (+a.distKm || 0))[0];
    rec.push(['Plus longue course', `${(+lr.distKm || 0).toFixed(1)} km <span class="mut">· ${shortDay(dayKey(lr.ts))}</span>`]);
    const er = C.slice().sort((a, b) => paidOf(b) - paidOf(a))[0];
    rec.push(['Course la mieux payée', `${dt3(paidOf(er))} DT <span class="mut">· ${shortDay(dayKey(er.ts))}</span>`]);
  }
  if(rec.length) html += `<div class="card"><div class="lbl2">Records de la période</div><div style="margin-top:6px">${rec.map(([k, v]) => srow(k, v)).join('')}</div></div>`;

  m.innerHTML = html;
  bindPer();
}

function renderServices(m){

  const months = {};

  for(const mk in months){

        <div class="v num"><b>${dt3(r.ca)} DT</b><small class="g">+${dt3(r.save + r.free)}</small></div></button>`;

function renderCourses(m){

function openRide(c){

    <div class="sub">${new Date(c.ts).toLocaleDateString('fr-FR')} · ${(+c.distKm || 0).toFixed(2)} km · attente ${c.waitMin} min · durée ${c.durMin} min<br>Prix ${rangeTxt(lo, hi)} DT</div>
    <div class="lbl2" style="margin-top:12px">Montant reçu</div>
    <div class="paychips">${payChoices(lo, hi).map(v => `<button class="num" data-v="${v}">${dt3(v)}</button>`).join('')}</div>
    <div class="addrow"><input id="rAmt" class="inp num" inputmode="decimal" value="${dt3(paidOf(c))}"><button class="btn pri sm" id="rOk">OK</button></div>

  const set = v => { if(!(v >= 0 && v < 1000)){ toast('Montant invalide'); return; } setPaid(c.id, v); closeTop(); refreshPage(); toast('Montant enregistré'); };
  el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => set(+b.dataset.v));
  el.querySelector('#rOk').onclick = () => set(r3(num(el.querySelector('#rAmt').value)));
  const rb = el.querySelector('[data-route]'); if(rb) rb.onclick = () => showRoute(c);
  el.querySelector('[data-del]').onclick = () => ask('Supprimer cette course ? Elle sera aussi retirée de son service.', 'Supprimer', () => { deleteRide(c.id); closeTop(); refreshPage(); toast('Course supprimée'); }, true);
}

/* ---------- VÉHICULE: info, odometer, consumption and costs (maintenance itself stays in SymJet) ---------- */
const DEF_V = {model: '', plate: '', year: '', odo: null, odoTs: 0};
function cleanVeh(o){
  o = o && typeof o === 'object' ? o : {};
  const t = (v, n) => typeof v === 'string' ? v.trim().slice(0, n) : '';
  return {model: t(o.model, 40) || DEF_V.model, plate: t(o.plate, 20), year: /^\d{4}$/.test(String(o.year || '')) ? String(o.year) : '',
    odo: okNum(o.odo) && o.odo < 1e7 ? Math.round(o.odo) : null, odoTs: okNum(o.odoTs) ? o.odoTs : 0};
}
function odometer(V){
  const c = [];
  if(V.odo != null) c.push({km: V.odo, ts: V.odoTs, src: 'saisi à la main'});
  const lk = store.get('lastKm', null); if(okNum(lk)) c.push({km: lk, ts: 0, src: 'fin du dernier service'});
  depenses.forEach(e => { if(e.km != null) c.push({km: e.km, ts: Date.parse(e.date) || 0, src: 'dépense du ' + e.date}); });
  return c.sort((a, b) => b.km - a.km)[0] || null;
}
function vehStats(days){

  let enriched = false;   // a hand-typed twin gets SymJet's km and litres when it has none
  recs.forEach(r => { const e = mine.find(x => x.date === r.date && x.cat === r.cat && Math.abs(x.amt - r.amt) < 0.001); if(!e) return;
    if(e.km == null && r.km != null){ e.km = r.km; enriched = true; } if(e.liters == null && r.liters != null){ e.liters = r.liters; enriched = true; } });
  const keep = recs.filter(r => !dup(r)), before = JSON.stringify(depenses.filter(e => e.id.startsWith('sj')).sort((a, b) => a.id < b.id ? -1 : 1));

      csvNum(r.fuel), g('maint'), g('fixed'), g('save'), g('free')].join(';'));
  });
  nat('saveFile', 'services-' + dayKey(Date.now()) + '.csv', 'text/csv', '﻿' + rows.join('\r\n'));
}
function exportCourses(){
  if(!trips.length) return toast('Aucune course à exporter');
  const rows = [['Date', 'Heure', 'Km', 'Attente (min)', 'Durée (min)', 'Prix min', 'Prix max', 'Reçu'].join(';')];
  trips.slice().reverse().forEach(c => rows.push([dayKey(c.ts), hm(c.ts), csvNum(+c.distKm || 0), csvNum(+c.waitMin || 0), c.durMin || 0, csvNum(c.lo ?? c.pay ?? 0), csvNum(c.hi ?? c.pay ?? 0), csvNum(paidOf(c))].join(';')));
  nat('saveFile', 'courses-' + dayKey(Date.now()) + '.csv', 'text/csv', '﻿' + rows.join('\r\n'));
}
/* restores a backup of this app, or imports the shifts of the old Caisse Moto app */
const backupState = () => { try{ return HAS && Android.backupStatus ? JSON.parse(Android.backupStatus()) : {}; }catch(e){ return {}; } };
function backupLine(){
  const b = backupState();
  if(!b.dir) return 'Désactivée. Choisis un dossier (par ex. Documents ou Drive) : l\'application y réécrit une copie après chaque changement.';
  return `Dossier : <b>${esc(b.dir)}</b> · ${b.last ? 'dernière copie ' + new Date(b.last).toLocaleString('fr-FR') : 'pas encore de copie'}${b.err ? ` · <span class="red">erreur : ${esc(b.err)}</span>` : ''}`;
}
window.onBackup = r => { toast(r === 'ok' ? 'Sauvegarde automatique faite' : 'Sauvegarde impossible : vérifie le dossier'); const el = $('bkStat'); if(el) el.innerHTML = backupLine(); };
/* Excel report (SpreadsheetML, opens in Excel / LibreOffice / Google Sheets), no library needed */
function exportExcel(){
  if(!services.length && !trips.length && !depenses.length) return toast('Rien à exporter');
  const x = v => String(v).replace(/[<>&"]/g, c => ({'<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;'}[c]));
  const cell = v => typeof v === 'number' && Number.isFinite(v) ? `<Cell><Data ss:Type="Number">${r3(v)}</Data></Cell>` : `<Cell><Data ss:Type="String">${x(v == null ? '' : v)}</Data></Cell>`;
  const sheet = (name, rows) => `<Worksheet ss:Name="${name}"><Table>${rows.map(r => `<Row>${r.map(cell).join('')}</Row>`).join('')}</Table></Worksheet>`;
  const S = [['Date', 'Début', 'Fin', 'Km départ', 'Km arrivée', 'Km', 'Km avec client', 'Heures', 'Courses', 'Chiffre d\'affaires', 'Pourboires', 'Carburant', ...POTS.map(P => P.name)]];
  services.forEach(sv => { const r = split(sv); S.push([sv.date, sv.t0 ? hm(sv.t0) : '', sv.t1 ? hm(sv.t1) : '', sv.startKm ?? '', sv.endKm ?? '', hasKm(sv) ? r.km : '', r.paidKm, sv.workMin / 60, sv.rides.length, r.ca, r.tips, r.fuel, ...r.pots.map(q => q.amt)]); });
  const C = [['Date', 'Heure', 'Km', 'Attente (min)', 'Durée (min)', 'Prix min', 'Prix max', 'Reçu']];
  trips.slice().reverse().forEach(c => C.push([dayKey(c.ts), hm(c.ts), +c.distKm || 0, +c.waitMin || 0, c.durMin || 0, c.lo ?? c.pay ?? 0, c.hi ?? c.pay ?? 0, paidOf(c)]));
  const xml = `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${sheet('Services', S)}${sheet('Courses', C)}${sheet('Dépenses', [['Date', 'Catégorie', 'Réserve', 'Montant', 'Km', 'Litres', 'Description'], ...depenses.map(e => [e.date, catOf(e.cat)[1], POT_INFO[catOf(e.cat)[2]][0], e.amt, e.km ?? '', e.liters ?? '', e.desc])])}</Workbook>`;
  nat('saveFile', 'compteur-moto-' + dayKey(Date.now()) + '.xls', 'application/vnd.ms-excel', xml);
}
/* recomputes every total from the raw records and reports anything inconsistent */
function checkData(){
  const q = asArr(store.get('quarantine', []));
  let bad = 0, ca = 0, rides = 0;
  services.forEach(sv => {
    const r = split(sv); ca += r.ca; rides += sv.rides.length;
    const tot = r3(r.fuel + sum(r.pots.map(x => x.amt)));
    if(Math.abs(tot - r.ca) > 0.0015) bad++;
  });
  const ids = new Set(), dup = trips.filter(c => c.id && (ids.has(c.id) || !ids.add(c.id))).length;
  const el = openModal(`<h2>Vérification des données</h2><div style="margin-top:6px">
    ${srow('Services enregistrés', services.length)}${srow('Courses dans les services', rides)}${srow('Courses du compteur', trips.length)}
    ${srow('Chiffre d\'affaires total', dt3(ca) + ' DT')}
    ${srow('Répartitions incohérentes', bad ? '<span class="red">' + bad + '</span>' : '0 ✓')}
    ${srow('Courses en double', dup ? '<span class="red">' + dup + '</span>' : '0 ✓')}
    ${srow('Dépenses', depenses.length + ' · ' + dt3(sum(depenses.map(e => e.amt))) + ' DT')}
    ${(() => { const G = ledger('all'), gap = r3(G.revAll - G.expAll - G.reserves - G.dispo); return srow('Revenu = dépenses + réserves + disponible', Math.abs(gap) < 0.002 ? '✓' : '<span class="red">écart ' + dt3(gap) + '</span>'); })()}
    ${srow('Éléments mis de côté (invalides)', q.length)}</div>
    ${q.length ? '<button class="btn sec" data-q>Exporter les éléments mis de côté</button>' : ''}
    <button class="btn pri" data-close>OK</button>`);
  const b = el.querySelector('[data-q]'); if(b) b.onclick = () => nat('saveFile', 'quarantaine-' + dayKey(Date.now()) + '.json', 'application/json', JSON.stringify(q));
}
function onImport(text){
  let o;
  try{ o = JSON.parse(text); }catch(e){ return toast('Ce fichier n\'est pas une sauvegarde valide'); }
  if(o && Array.isArray(o.log) && Array.isArray(o.fuel) && !o.services) return importSymJet(o, true);
  if(!o || !Array.isArray(o.services) || (o.app !== 'compteur-moto' && o.app !== 'caisse-moto')) return toast('Ce fichier n\'est pas une sauvegarde valide');
  const list = sanitizeList('services', o.services, cleanShift);
  if(o.app === 'caisse-moto'){
    const ids = new Set(services.map(s => s.id)), add = list.filter(s => !ids.has(s.id));
    if(!add.length){ store.set('caisseDone', true); refreshPage(); return toast('Rien de nouveau : ces services sont déjà dans l\'application'); }
    ask(`Importer ${add.length} service${add.length > 1 ? 's' : ''} de Caisse Moto ?<br><span class="mut">Tes réglages de partage seront aussi repris. Les services déjà présents ne sont pas dupliqués.</span>`, 'Importer', () => {
      services = services.concat(add);
      if(o.reglages) R = cleanCfg(o.reglages);
      store.set('reglages', R); persistAll();
      if(typeof o.lastKm === 'number' && !(store.get('lastKm', null) >= o.lastKm)) store.set('lastKm', o.lastKm);
      store.set('caisseDone', true);
      refreshPage(); toast(add.length + ' service' + (add.length > 1 ? 's' : '') + ' importé' + (add.length > 1 ? 's' : ''));
    });
    return;
  }
  ask(`Remplacer toutes tes données par cette sauvegarde (${list.length} services, ${Array.isArray(o.courses) ? o.courses.length : 0} courses) ?`, 'Restaurer', () => {
    services = list; R = cleanCfg(o.reglages);
    depenses = sanitizeList('depenses', o.depenses, cleanExp); saveExps();
    const ph = o.photos && typeof o.photos === 'object' ? o.photos : Object.fromEntries(Object.keys(o).filter(k => k.startsWith('ph_')).map(k => [k.slice(3), o[k]]));
    depenses.forEach(e => { if(e.photo){ if(PHOTO_OK(ph[e.id])) store.set('ph_' + e.id, ph[e.id]); else delete e.photo; } }); saveExps();
    if(o.objectifs && typeof o.objectifs === 'object') store.set('objectifs', cleanGoals(o.objectifs));
    if(o.vehicule && typeof o.vehicule === 'object') store.set('vehicule', cleanVeh(o.vehicule));
    if(typeof o.suivi === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(o.suivi)) store.set('suivi', o.suivi);
    if(Array.isArray(o.courses)) trips = sanitizeList('courses', o.courses, cleanTrip).slice(0, 3000);
    if(o.tarifs && o.tarifs.v === 2){ store.set('tarifs', o.tarifs); T = loadTarifs(); }
    cur = cleanCur(o.service);
    store.setSync('reglages', R); store.setSync('courses', trips); persistAll(); saveCur();
    if(!list.length && typeof o.lastKm === 'number') store.set('lastKm', o.lastKm);
    paintTarif(); refreshPage(); toast('Sauvegarde restaurée');
  });
}

/* ====================================================================
   Overlays: full-screen sheets and bottom modals, closed by the back button
   ==================================================================== */
const stack = [];
function openSheet(html, tag){
  const el = document.createElement('div');
  el.className = 'sheet'; el.innerHTML = html; el.dataset.tag = tag || '';
  document.body.appendChild(el); stack.push(el);
  el.querySelectorAll('[data-close]').forEach(b => b.onclick = closeTop);
  return el;
}
function openModal(html, tag){
  const bg = document.createElement('div');
  bg.className = 'modal-bg'; bg.innerHTML = '<div class="modal">' + html + '</div>'; bg.dataset.tag = tag || '';
  bg.onclick = e => { if(e.target === bg) closeTop(); };
  document.body.appendChild(bg); stack.push(bg);
  bg.querySelectorAll('[data-close]').forEach(b => b.onclick = closeTop);
  return bg;
}
function closeTop(){ const el = stack.pop(); if(el){ el.remove(); lockUntil = Date.now() + 600; } }
function closeTagged(tag){ for(let i = stack.length - 1; i >= 0; i--) if(stack[i].dataset.tag === tag){ stack[i].remove(); stack.splice(i, 1); lockUntil = Date.now() + 600; } }
function ask(msg, okLabel, cb, danger, noLabel = 'Annuler'){
  const el = openModal(`<div class="msg">${msg}</div>
    <div class="row"><button class="btn sec" data-close>${noLabel}</button><button class="btn ${danger ? 'delf' : 'pri'}" data-ok>${okLabel}</button></div>`);
  el.querySelector('[data-ok]').onclick = () => { closeTop(); cb(); };
}
let toastT = null, toastFn = null;
function toast(msg, label, fn){
  clearTimeout(toastT); toastFn = fn || null;
  $('toast').innerHTML = `<span>${esc(msg)}</span>${label ? `<button onclick="toastAct()">${esc(label)}</button>` : ''}`;
  $('toast').classList.add('show');
  toastT = setTimeout(() => $('toast').classList.remove('show'), label ? 6000 : 2600);
}
function toastAct(){ $('toast').classList.remove('show'); toastFn && toastFn(); }
function refreshPage(){ if(page === 'home') renderHome(); else if(page === 'caisse') renderCaisse(); else if(page === 'ana') renderAna(); else if(page === 'dash') renderDash(); else if(page === 'dep') renderDep(); else if(page === 'stats') renderStats(); else if(page === 'hist') renderHist(); else if(page === 'set') renderSettings(); }
/* Android back button: close the top overlay, then go back to the meter */
function handleBack(){
  if(stack.length){
    const top = stack[stack.length - 1];
    if(top.dataset.tag === 'cut' || top.dataset.tag === 'short') return 1;   // these need an answer
    const wasReceipt = top.dataset.tag === 'receipt';
    closeTop(); if(wasReceipt) lockUntil = Date.now() + 600;
    return 1;
  }
  if(page === 'set'){ showPage('home'); return 1; }
  if(page !== 'meter'){ showPage('meter'); return 1; }
  return 0;
}
window.onPause = () => { awayAt = Date.now(); fg = false; };
// back from another app: the private area closes itself after a minute away (not after a file picker or share)
window.onResume = () => {
  applyTheme(); try{ syncSymJet(false); }catch(e){}
  const away = awayAt ? Date.now() - awayAt : 0; awayAt = 0; fg = true;
  if(!running) try{ closeStale(Date.now()); }catch(e){}
  if(page !== 'meter' && away > 60000 && !filePending){ while(stack.length) closeTop(); showPage('meter'); }
  filePending = false;
  if(HAS && typeof Android.immersive === 'function') try{ Android.immersive(page === 'meter'); }catch(e){}
  paint(true); if(!stack.length) refreshPage();
};
function nat(fn, ...a){ filePending = true; return NATIVE[fn](...a); }

/* ====================================================================
   Start
   ==================================================================== */
document.body.classList.add('onmeter');
try{ closeStale(Date.now()); }catch(e){}
paint(true); paintMain(); paintTarif(); refreshNav();
if(HAS && typeof Android.immersive === 'function') try{ Android.immersive(true); }catch(e){}
setInterval(() => {
  paint();
  const t = $('timer');
  if(t && page === 'caisse' && cur && !cur.endAt) t.textContent = clock(workMs(cur, Date.now()));
}, 500);

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Compteur Moto</title>
<style>
:root{
  --bg:#050505;--panel:#111;--panel2:#191919;--line:#272727;--fg:#f2f2f2;--mut:#8e8e8e;
  --led:#35e07a;--ledoff:#0b1f12;--amber:#ffb020;--amberoff:#251b07;--go:#18a957;--stop:#e0352b;--acc:#ffb020;--red:#ef4444;
  --fuel:#f97316;--maint:#3b82f6;--fixed:#a78bfa;--moto:#06b6d4;--save:#22c55e;--free:#facc15;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 Roboto,system-ui,"Segoe UI",sans-serif;overscroll-behavior:none}
body{user-select:none}
button{font:inherit;cursor:pointer;color:inherit}
input{user-select:text}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.red{color:var(--red)}.g{color:var(--save)}.y{color:var(--free)}.b{font-weight:700}
.page{display:none;max-width:560px;margin:0 auto}
.page.on{display:block}
body.navon .page{padding-bottom:calc(78px + env(safe-area-inset-bottom))}

/* ================= meter (what the client sees) ================= */
#pMeter.on{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,13px);min-height:100vh;max-width:520px;padding:clamp(8px,1.5vh,14px) 10px calc(clamp(12px,2vh,20px) + env(safe-area-inset-bottom))}
.mtop{display:flex;align-items:stretch;gap:8px;height:clamp(50px,8vh,62px);flex:none}
.key{width:clamp(48px,13vw,58px);flex:none;border-radius:14px;background:#141414;border:1px solid #2a2a2a;color:#7a7a7a;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.key:active{background:#222}
.key svg{width:24px;height:24px}
.gdot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;display:none}
.gdot.weak{display:block;background:var(--amber)}
.gdot.lost{display:block;background:#fff;animation:blink 1s steps(2) infinite}
.lamp{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:14px;font-weight:900;font-size:clamp(18px,3vh,24px);letter-spacing:.16em;color:#fff;background:#0f8a3e;box-shadow:0 0 18px rgba(15,138,62,.4),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.25);transition:background .3s,box-shadow .3s}
.lamp i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;flex:none}
.lamp.busy{background:#f2f2f2;color:#000;box-shadow:0 0 18px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.2)}
.lamp.busy i{animation:pulse 1.6s infinite;background:#000;box-shadow:none}
.lamp.pay{background:#b86a00;box-shadow:0 0 18px rgba(184,106,0,.5),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -2px 0 rgba(0,0,0,.25)}
@keyframes pulse{50%{opacity:.35}}
@keyframes blink{50%{opacity:.25}}
.meter{flex:none;background:linear-gradient(180deg,#1c1c1c,#0f0f0f);border:1px solid #2c2c2c;border-radius:18px;padding:7px;display:flex;flex-direction:column;gap:7px;box-shadow:0 12px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
.win{background:#060403 linear-gradient(180deg,rgba(255,255,255,.035),transparent 38%);border-radius:11px;border:1px solid rgba(0,0,0,.85);box-shadow:inset 0 2px 12px rgba(0,0,0,.95);padding:7px 10px 9px}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;letter-spacing:.17em;color:#a6a6a6;margin-bottom:4px}
.unit{font-size:14px;font-weight:900;color:var(--led);letter-spacing:.1em}
.prow+.prow{margin-top:6px;padding-top:6px;border-top:1px solid #171717}
.prow .seg{width:100%;height:auto;max-height:min(100px,11.5vh)}
.rinfo{display:none;justify-content:space-between;gap:6px;margin-top:6px;padding:4px 2px 0;border-top:1px solid #222;color:#9a9a9a;font-size:11.5px;letter-spacing:.06em;white-space:nowrap;overflow:hidden}
.rinfo b{color:#e8e8e8;font-weight:700}body.riding .rinfo{display:flex}
@media (max-height:700px){body.riding .tcard .th,body.riding .tcard .trow:nth-child(5){display:none}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.row2 .lbl{font-size:10.5px;letter-spacing:.12em}
.row2 .seg{width:100%;height:clamp(26px,4.8vh,46px)}
.cl{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3a2a08;margin-right:6px;vertical-align:0}
.cl.on{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.seg{display:block}
.seg .on{fill:var(--led)}.seg .off{fill:var(--ledoff)}
.seg.am .on{fill:var(--amber)}.seg.am .off{fill:var(--amberoff)}
.idle .seg .on{opacity:.55}
.tcard{flex:none;display:block;width:100%;text-align:left;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:14px;padding:9px 14px 8px}
.tcard:active{background:#121212}
body.riding .tcard:active{background:#0a0a0a}
.tcard .th{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.2em;color:#8e8e8e;margin-bottom:1px}
.tcard .th b{color:var(--amber);letter-spacing:.04em;font-size:13px}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:clamp(2px,.55vh,5px) 0;border-top:1px solid #1c1c1c}
@media (max-height:700px){.tnote{display:none}.tcard{padding:6px 12px}}
.th+.trow{border-top:0}
.trow span{color:#9a9a9a;font-size:clamp(13.5px,2vh,15.5px);font-weight:600}
.trow b{font-size:clamp(15px,2.4vh,20px);font-weight:800;font-variant-numeric:tabular-nums;color:#efefef;white-space:nowrap}
.tnote{font-size:11.5px;color:#777;margin-top:3px}
.main-btn{margin-top:auto;flex:none;position:relative;overflow:hidden;width:100%;height:clamp(64px,11vh,100px);border:0;border-radius:18px;font-size:clamp(20px,3.1vh,26px);white-space:nowrap;font-weight:900;letter-spacing:.1em;color:#fff;background:#15803d;box-shadow:0 6px 0 #0b5a2a;touch-action:manipulation;transition:transform .06s,background .15s}
.main-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0b5a2a}
.main-btn.stop{background:#f2f2f2;color:#000;box-shadow:0 6px 0 #8c8c8c}
.main-btn.stop:active{box-shadow:0 2px 0 #8c8c8c}
.main-btn.armed{background:var(--amber);color:#1a1200;box-shadow:0 6px 0 #8a5a00}
.main-btn small{display:block;font-size:13px;letter-spacing:.08em;font-weight:800;margin-top:2px}
.armbar{position:absolute;left:0;bottom:0;height:7px;width:100%;background:rgba(0,0,0,.35);transform-origin:left;animation:shrink 3s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
@media (max-height:330px){.rinfo,.row2 .win+.win,.row2 .lbl,.mtop,.tcard,.main-btn,#toast,nav,.modal-bg{display:none!important}#pMeter.on{min-height:0;padding:3px;gap:0}.meter{padding:3px;border-radius:8px}.win{padding:2px 6px}.prow .lbl{font-size:13px;margin:0;letter-spacing:.08em}.prow .lbl span:first-child{color:#fff}.prow .seg{max-height:26vh}.prow+.prow{margin-top:2px;padding-top:2px}}
body.onmeter #toast{top:calc(12px + env(safe-area-inset-top));bottom:auto}

/* ================= bottom navigation (private, hidden during a ride) ================= */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:none;background:rgba(10,10,10,.97);border-top:1px solid var(--line);padding:5px 4px calc(6px + env(safe-area-inset-bottom))}
body.navon nav{display:flex}
nav button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:6px 0;position:relative}
nav button.on{color:var(--amber)}
nav svg{width:23px;height:23px}
nav .live{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--save);display:none}
nav .live.on{display:block}

/* ================= private pages ================= */
.phead{display:flex;align-items:baseline;justify-content:space-between;padding:16px 16px 6px}
.phead h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.01em}
.phead .d{color:var(--mut);font-size:13px}
.pbody{padding:6px 16px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.center{text-align:center}
.lbl2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:800}
.title{font-size:19px;font-weight:800;margin-top:2px}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.hint{color:var(--mut);font-size:13px;margin-top:10px}
.flexb{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.field{margin-bottom:12px}.field>.lbl2{display:block;margin-bottom:6px}
.inp{width:100%;background:#080808;border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:13px 14px;font-size:18px;font-weight:700;outline:none;font-family:inherit}
.inp:focus{border-color:var(--amber)}
.inp.big{font-size:30px;text-align:center;padding:14px;letter-spacing:.03em}
.inp.sm{width:108px;text-align:right;font-size:16px;padding:10px 12px;flex:none}
input[type=date].inp{font-size:16px;color-scheme:dark}
.unitbox{position:relative}.unitbox span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;pointer-events:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800;letter-spacing:.03em;margin-top:10px;text-align:center}
.btn.pri{background:var(--amber);color:#1a1200}
.btn.pri:active{background:#e09a12}
.btn.go{background:var(--go);color:#fff}
.btn.sec{background:var(--panel2);border:1px solid var(--line);font-weight:700}
.btn.del{background:transparent;color:var(--red);border:1px solid #4a2020;font-weight:700}
.btn.delf{background:var(--red);color:#fff}
.btn.sm{width:auto;margin:0;padding:12px 16px;flex:none}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--mut);font-size:14px;text-decoration:underline;padding:6px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.08em}
.pill.run{background:rgba(34,197,94,.14);color:var(--save)}
.pill.pause{background:rgba(250,204,21,.14);color:var(--free)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.run .dot{animation:blink 1.6s infinite}
.timer{font-size:56px;font-weight:800;margin:14px 0 6px;letter-spacing:.02em;line-height:1}
.meta{color:var(--mut);font-size:13px}
.big2{font-size:20px;font-weight:800;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 0;min-width:52px;font-size:15px;font-weight:800;flex:1 0 52px}
.chip:active{background:#2b2410}
.chip.acc{background:rgba(255,176,32,.12);border-color:#5a4313;color:var(--amber);padding:12px 16px;flex:none}
.ride{display:inline-flex;align-items:center;gap:4px;background:rgba(255,176,32,.11);border-radius:10px;padding:6px 4px 6px 10px;font-weight:800;font-size:15px}
.ride.m{background:rgba(255,255,255,.09)}
.ride small{font-size:11px;color:var(--mut);font-weight:700}
.ride button{background:none;border:0;color:var(--mut);font-size:18px;padding:0 6px;line-height:1}
.addrow{display:flex;gap:8px;margin-top:12px}
.kmline{margin:-2px 0 14px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:left}
.stat{background:var(--panel2);border-radius:12px;padding:10px}
.stat .lbl2{font-size:10.5px}
.stat b{display:block;font-size:17px;margin-top:3px;white-space:nowrap}
.ca{font-size:44px;font-weight:800;margin-top:4px;line-height:1.05}.ca small{font-size:18px;color:var(--mut);font-weight:700}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel2);margin:14px 0 8px}
.bar i{display:block;height:100%}
.ln{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ln:first-of-type{border-top:0}
.ln .sw{width:12px;height:12px;border-radius:4px;flex:none}
.ln .t{flex:1;min-width:0;font-weight:700}.ln .t small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;font-weight:400}
.ln .v{font-weight:800;font-size:17px;white-space:nowrap;text-align:right}
.ln.total{border-top:1px dashed #3a3a3a}
.verdict{border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:15px;line-height:1.45}
.verdict.ok{background:rgba(34,197,94,.09);border:1px solid #1e5a33}
.verdict.mid{background:rgba(250,204,21,.07);border:1px solid #5a4e1e}
.empty-km{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#3a1a14;margin:10px 0 6px}
.empty-km i{background:var(--save);display:block}
.sum{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:10px 8px;font-size:14.5px;margin-top:12px}
.sum .num{text-align:right}.sum .lbl2{text-align:right}
.steps{margin:10px 0 0;padding-left:20px;color:var(--mut);font-size:14px}.steps li{margin-bottom:6px}.steps b{color:var(--fg)}
.seg2{display:flex;background:var(--panel2);border-radius:13px;padding:3px;margin-bottom:12px}
.seg2 button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:10px;font-weight:800;font-size:14px}
.seg2 button.on{background:#2a2a2a;color:var(--fg)}
.chart{display:flex;gap:4px;height:130px;margin-top:14px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.col .area{flex:1;width:100%;display:flex;align-items:flex-end}
.col .bv{width:100%;background:#3a3020;border-radius:4px 4px 0 0;display:flex;align-items:flex-end;overflow:hidden}
.col .bp{width:100%;background:var(--save)}
.col span{font-size:10.5px;color:var(--mut);margin-top:5px}
.col.today span{color:var(--fg);font-weight:800}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;gap:8px}
.mhead b{font-size:16px}.mhead span{font-size:12.5px;color:var(--mut);text-align:right}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;width:100%;text-align:left;font-size:15px}
.item:active{background:var(--panel2)}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:15px}.item .t small{color:var(--mut);font-size:12.5px}
.item .v{text-align:right;white-space:nowrap}.item .v b{display:block;font-size:16px}.item .v small{font-size:12.5px;font-weight:700}
.set{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .t{flex:1;min-width:0;font-weight:700}.set .t small{display:block;color:var(--mut);font-size:12.5px;font-weight:400;margin-top:2px}
.tg{position:relative;width:50px;height:30px;flex:none}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg span{position:absolute;inset:0;background:#333;border-radius:15px;transition:.2s}
.tg span:before{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#bbb;transition:.2s}
.tg input:checked+span{background:var(--amber)}
.tg input:checked+span:before{transform:translateX(20px);background:#fff}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:20px;font-weight:800;padding:0}
.step button:disabled{opacity:.3}
.step b{min-width:48px;text-align:center;font-size:16px}
.prev{background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;margin-top:6px}
.nsep{width:1px;background:var(--line);margin:8px 2px;flex:none}
.mt{padding:0 16px}
.mtabs{display:flex;gap:6px;background:var(--panel2);border-radius:14px;padding:4px;margin-top:4px}
.mtabs button{flex:1;border:0;background:none;color:var(--mut);padding:11px 4px;border-radius:11px;font-weight:800;font-size:13.5px}
.mtabs button.on{background:var(--amber);color:#1a1200}
.hero{background:linear-gradient(160deg,#1b1608,#111);border:1px solid #3a2e10;border-radius:20px;padding:18px;margin-bottom:12px;text-align:center}
.hero-v{font-size:46px;font-weight:900;line-height:1.05;margin:6px 0 4px}.hero-v small{font-size:18px;color:var(--mut)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.big-tile{display:flex;flex-direction:column;gap:6px;text-align:left;border-radius:18px;padding:14px;border:1px solid var(--line);background:var(--panel)}
.big-tile b{font-size:26px;font-weight:900}.big-tile small{font-size:12.5px;color:var(--mut);font-weight:700}
.big-tile.aside{border-color:#1e4a6b;background:linear-gradient(160deg,#0d1c29,#111)}.big-tile.aside b{color:#7cc0ff}.big-tile.aside small{color:#7cc0ff}
.big-tile.free{border-color:#5a4e1e;background:linear-gradient(160deg,#211d0a,#111)}.big-tile.free b{color:var(--free)}
.big-tile:active,.save-row:active{filter:brightness(1.3)}
.save-row .sw{width:12px;height:12px;border-radius:4px;flex:none}
.ledger .lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px 0;border:0;border-top:2px solid #000;background:none;text-align:left;font-size:16px;font-weight:700;color:var(--fg)}
.ledger .lbl2+.lrow{border-top:0;margin-top:4px}
.ledger .lrow small{display:block;font-size:12.5px;font-weight:450;color:var(--mut);margin-top:2px}
.ledger .lrow b{font-size:19px;font-weight:800;white-space:nowrap}
.ledger .lrow.tot{border-top:4px solid #000}.ledger .lrow.tot b{font-size:22px}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.catgrid button{background:#fff;border:3px solid #000;padding:11px 6px;font-weight:700;font-size:14px;color:#000}
.catgrid button.on{background:#0000ff;color:#fff}
.modesw{display:block;margin-top:4px;background:none;border:0;padding:0;color:var(--acc2);font-size:12.5px;font-weight:700;text-decoration:underline;text-align:left}
.ins{border-left:8px solid #000;padding:10px 12px;margin-bottom:10px;background:#f5f4ee;font-size:15px;line-height:1.45}
.ins.good{border-left-color:#0000ff}.ins.bad{border-left-color:#ff0000}
.ins small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
.hbars .c{cursor:pointer}
#anaTabs .mtabs button{font-size:12.5px;padding:11px 2px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.eadv{margin-top:10px}.eadv summary{cursor:pointer;padding:6px 0}
.rana{margin-top:12px}
.vcard{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}.vcard b{font-size:18px}.vcard .y{font-size:28px;font-weight:800}
.vtab{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}.vtab th{font-size:11px;letter-spacing:.08em;text-align:right;padding:4px}
.vtab td{padding:7px 4px;border-top:1px solid var(--line);text-align:right}.vtab td:first-child{text-align:left;color:var(--mut)}.vtab tr.tot td{font-weight:800;color:var(--fg);border-top:1px solid var(--acc2)}.vtab th{color:var(--mut)}
.hdate{font-weight:700;text-transform:capitalize;margin:2px 0 12px;color:var(--mut)}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.hgrid button{background:var(--panel);border:1px solid var(--line);border-radius:16px;font:inherit;font-size:13px;font-weight:600;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);cursor:pointer}

<script>
'use strict';
/* ====================================================================
   Storage & native bridge
   ==================================================================== */
const HAS = typeof window.Android !== 'undefined';
const store = {
  get(k, d = null){ try{ const v = HAS ? Android.get(k) : localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ const s = JSON.stringify(v); try{ HAS ? Android.set(k, s) : localStorage.setItem(k, s); }catch(e){} },
  // money records: written to disk before returning (commit)
  setSync(k, v){ const s = JSON.stringify(v); try{ if(HAS && typeof Android.setSync === 'function') Android.setSync(k, s); else if(HAS) Android.set(k, s); else localStorage.setItem(k, s); }catch(e){} }
};
const NATIVE = HAS ? Android : {
  share: t => { console.log(t); toast('Partage (aperçu)'); },
  saveFile: (name, mime, content) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type: mime})); a.download = name; a.click(); },
  pickImport: () => { const i = document.createElement('input'); i.type = 'file'; i.onchange = () => i.files[0] && i.files[0].text().then(onImport); i.click(); },
  version: () => 'aperçu'
};

/* ====================================================================
   Helpers
   ==================================================================== */
const $ = id => document.getElementById(id);
const esc = v => String(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const r3 = x => Math.round(x * 1000) / 1000;
const dt3 = x => r3(x).toFixed(3);
const sum = a => r3(a.reduce((s, x) => s + x, 0));
const num = s => { const v = parseFloat(String(s == null ? '' : s).replace(/\s/g, '').replace(',', '.')); return Number.isFinite(v) ? v : NaN; };
const pad = n => String(n).padStart(2, '0');
const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const JOURS_L = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const MOIS_L = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const keyDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const shortDay = k => { const d = keyDate(k); return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()]; };
const longDay = k => { const d = keyDate(k); return JOURS_L[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS_L[d.getMonth()].toLowerCase() + ' ' + d.getFullYear(); };
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const clock = ms => { const s = Math.floor(ms / 1000); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); };
const mmss = ms => { const s = Math.floor(Math.max(0, ms) / 1000); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
const durMin = min => { const t = Math.round(min); return Math.floor(t / 60) + ' h ' + pad(t % 60); };
const km = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const QUICK = [2, 2.5, 3, 3.5, 4, 5, 6, 7.5, 10];
function buzz(ms = 30){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

/* ====================================================================
   Tariffs: one start price, a per-km RANGE (min–max, open for tips), waiting per minute
   ==================================================================== */
const DEF_T = {v: 2, base: 0.5, kmLo: 0.7, kmHi: 1.0, min: 0.15, thr: 10, round: true, minFare: 2.0};
function loadTarifs(){
  const o = store.get('tarifs'), t = {...DEF_T};
  const ok = v => typeof v === 'number' && Number.isFinite(v) && v >= 0 && v < 1000;
  if(o && typeof o === 'object'){
    ['min', 'thr', 'minFare'].forEach(k => { if(ok(o[k])) t[k] = o[k]; });
    if(typeof o.round === 'boolean') t.round = o.round;
    if(o.v === 2) ['base', 'kmLo', 'kmHi'].forEach(k => { if(ok(o[k])) t[k] = o[k]; });
  }
  if(!(t.thr > 0)) t.thr = DEF_T.thr;
  if(t.kmHi < t.kmLo) t.kmHi = t.kmLo;
  // 2.0: the old single price per km becomes the 0.700–1.000 range, and the start goes back to 0.500
  if(!o || o.v !== 2) store.set('tarifs', t);
  return t;
}
let T = loadTarifs();
const rawFare = (st, perKm, t = T) => t.base + st.distM / 1000 * perKm + st.waitMs / 60000 * t.min;
// rounded up to 100 millimes and never below the minimum fare (only on the receipt: the meter still starts at the start price)

function quote(st, t = T){

/* ====================================================================
   Seven-segment display: only the lit segments glow; unlit "ghost" segments stay dark
   ==================================================================== */
const SK = Math.tan(6 * Math.PI / 180);
const GEO = {big: {w: 40, h: 92, t: 9.5, gap: 9}, small: {w: 36, h: 64, t: 8, gap: 8}};
const DIG = {'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''};
const PC = {};
function polys(k){
  if(PC[k]) return PC[k];
  const {w, h, t} = GEO[k], s = 1.2, ht = t / 2, m = h / 2;
  const H = y => `${ht + s},${y} ${t + s},${y - ht} ${w - t - s},${y - ht} ${w - ht - s},${y} ${w - t - s},${y + ht} ${t + s},${y + ht}`;
  const V = (x, y0, y1) => `${x},${y0} ${x + ht},${y0 + ht} ${x + ht},${y1 - ht} ${x},${y1} ${x - ht},${y1 - ht} ${x - ht},${y0 + ht}`;
  return PC[k] = {a: H(ht), b: V(w - ht, ht + s, m - s), c: V(w - ht, m + s, h - ht - s), d: H(h - ht), e: V(ht, m + s, h - ht - s), f: V(ht, ht + s, m - s), g: H(m)};
}
function seg(str, cls = '', k = 'big'){
  const {w, h, t, gap} = GEO[k], P = polys(k), r = +(t * .62).toFixed(2);
  let x = 0, last = 0, on = '', off = '';
  const dot = (cx, cy) => { on += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}"/>`; };
  for(const ch of str){
    if(ch === '.'){ const cx = last + w + 1.5 + r; dot(cx, h - r); x = cx + r + gap; continue; }
    if(ch === ':'){ const cx = x + r; dot(cx, h * .3); dot(cx, h * .7); x = cx + r + gap; continue; }
    const lit = DIG[ch] ?? '';
    for(const [s, p] of Object.entries(P)){
      const poly = `<polygon transform="translate(${x.toFixed(1)} 0)" points="${p}"/>`;
      if(lit.includes(s)) on += poly; else off += poly;
    }
    last = x; x += w + gap;
  }
  const W = x - gap, pad = 4, dx = SK * h + pad;
  return `<svg class="seg ${cls}" viewBox="0 0 ${(W + dx + pad).toFixed(1)} ${h + 2 * pad}" preserveAspectRatio="xMaxYMid meet"><g transform="translate(${dx.toFixed(1)} ${pad}) skewX(-6)"><g class="off">${off}</g><g class="on" filter="url(#glow)">${on}</g></g></svg>`;
}

/* ---------- start / stop: one tap to start; to end, tap then confirm within 3 s ---------- */
let pendingStart = false;
function mainAction(){
  const now = Date.now();

  if(now - rideT0 < 1500) return;                     // a double tap on DÉMARRER must not arm the stop
  if(!armedAt){ armedAt = now; paintMain(); buzz(30); clearTimeout(armT); armT = setTimeout(disarm, 3000); return; }

/* ---------- end of ride: save, link to the shift, show the receipt ---------- */
const COORD = /^-?\d{1,3}(\.\d+)?,-?\d{1,3}(\.\d+)?$/;

  if(!c || typeof c !== 'object' || !n(c.ts)) return null;

    const tt = {round: c.t.round !== false};
    ['base', 'kmLo', 'kmHi', 'min', 'minFare'].forEach(k => { if(n(c.t[k]) && c.t[k] < 1000) tt[k] = c.t[k]; });
    if(['base', 'kmLo', 'kmHi', 'min'].every(k => k in tt)) t.t = tt;

  if(bad.length){
    const q = asArr(store.get('quarantine', []));
    bad.forEach(x => q.push({kind, at: Date.now(), item: x}));

    const v = o[k];
    if(typeof DEF_R[k] === 'boolean'){ if(typeof v === 'boolean') c[k] = v; }
    else if(typeof v === 'number' && Number.isFinite(v) && v >= 0 && v <= 1000) c[k] = v;
  }
  if((!(c.fSave > 0) && c.pSave < MIN_SAVE) || pFree(c) < MIN_FREE){ c.pMaint = DEF_R.pMaint; c.pFixed = DEF_R.pFixed; c.pSave = DEF_R.pSave; }

}

  const r = {p: r3(o.p)};
  ['km', 'lo', 'hi'].forEach(k => { if(okNum(o[k]) && o[k] <= 1000) r[k] = o[k]; });
  if(okNum(o.ts)) r.ts = o.ts;

    .slice(0, 100).map(n => ({ts: n.ts, type: n.type === 'incident' ? 'incident' : 'note', text: n.text.trim().slice(0, 200)}));
}

const kmTxt = v => typeof v === 'number' && Number.isFinite(v) && v >= 0 ? v : typeof v === 'string' ? v.replace(/[^\d.,\s]/g, '').slice(0, 12) : null;

/* every finished meter ride goes into the open shift; with no shift open, one starts quietly (never asked on the meter screen) */
function addRideToShift(c){
  closeStale(Date.now());
  const r = cleanRide({cid: c.id, p: c.paid, km: c.distKm, lo: c.lo, hi: c.hi, ts: c.ts});
  if(!r) return;
  // a ride that ended on an earlier day (interrupted, finished later) belongs to that day
  if(!cur && dayKey(c.ts) !== dayKey(Date.now())){
    const s = services.filter(x => x.date === dayKey(c.start)).pop();
    if(s){ s.rides.push(r); if(s.t1 != null) s.t1 = Math.max(s.t1, c.ts); }

  else if(cur.endAt){   // a ride after "Terminer le service": the shift goes on, the gap counts as a break

/* ====================================================================
   Dépenses réelles: what was actually paid. Each category draws on a reserve (pot).
   ==================================================================== */
const ECATS = [
  ['carb', 'Carburant', 'fuel'], ['huile', 'Huile moteur', 'maint'], ['boite', 'Huile de boîte', 'maint'], ['pneus', 'Pneus', 'maint'],
  ['freins', 'Freins', 'maint'], ['repar', 'Réparation', 'maint'], ['pieces', 'Pièces', 'maint'], ['assur', 'Assurance', 'fixed'],
  ['taxes', 'Taxes / administratif', 'fixed'], ['autre', 'Autre', 'free']];
const catOf = k => ECATS.find(c => c[0] === k) || ECATS[ECATS.length - 1];
function cleanExp(o){
  if(!o || typeof o !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(o.date) || !okNum(o.amt) || o.amt <= 0 || o.amt > 100000 || !ECATS.some(c => c[0] === o.cat)) return null;
  const e = {id: String(o.id || '').replace(/[^\w-]/g, '').slice(0, 24) || uid(), date: o.date, cat: o.cat, amt: r3(o.amt),
    desc: typeof o.desc === 'string' ? o.desc.slice(0, 120) : ''};

let depenses = sanitizeList('depenses', store.get('depenses', []), cleanExp);

function trackStart(){
  const s = store.get('suivi', null); if(typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  let m = cur ? dayKey(cur.t0) : null;
  for(const x of services) if(!m || x.date < m) m = x.date;
  for(const c of trips){ const d = dayKey(c.ts); if(!m || d < m) m = d; }
  return m || dayKey(Date.now());
}
const mexp = () => { const s = trackStart(); return depenses.filter(e => e.date >= s); };
const oldExp = () => { const s = trackStart(); return depenses.filter(e => e.date < s); };
const saveExps = () => { depenses.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0); store.setSync('depenses', depenses); };
const PHOTO_OK = v => typeof v === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v) && v.length < 2e6;

const POTS = [
  {k: 'maint', p: 'pMaint', name: 'Entretien', color: 'var(--maint)', sub: 'vidange, pneus, courroie, galets, freins'},
  {k: 'fixed', p: 'pFixed', name: 'Frais fixes', color: 'var(--fixed)', sub: 'assurance, vignette, téléphone'},
  {k: 'save', p: 'pSave', name: 'Épargne', color: 'var(--save)', sub: 'à ne pas toucher'},
  {k: 'free', p: null, name: 'Libre', color: 'var(--free)', sub: 'nourriture et dépenses personnelles'}
];
const fk = P => 'f' + P.p.slice(1);
const isFix = (c, P) => !!(P.p && c[fk(P)] > 0);
const potPct = (c, P) => P.p ? (isFix(c, P) ? 0 : c[P.p]) : pFree(c);
const REAL = {fuel: 0.100, maint: 0.073};   // rough real costs per km, only used for advice
const rsum = rides => sum(rides.map(r => r.p));
/* 1. fuel: a fixed amount per shift (or everything, if the shift made less)
   2. the rest is shared by percentages; Libre takes what's left so the total is exact */
function split(s){
  const c = s.cfg, kmD = hasKm(s) ? Math.max(0, s.endKm - s.startKm) : 0, ca = rsum(s.rides);
  const fuel = r3(Math.min(c.fuelFixed, ca)), rest = r3(ca - fuel);
  const raw = {}, rd = {};
  let left = rest;
  for(const P of POTS) if(isFix(c, P)){ raw[P.k] = rd[P.k] = r3(Math.min(c[fk(P)], Math.max(0, left))); left = r3(left - rd[P.k]); }
  for(const P of POTS) if(P.p && !isFix(c, P)){ raw[P.k] = left * c[P.p] / 100; rd[P.k] = c.round ? Math.round(raw[P.k] * 10) / 10 : r3(raw[P.k]); }
  let amt = rd, free = r3(rest - sum(Object.values(rd)));
  if(free < 0){ amt = {}; for(const k in raw) amt[k] = r3(raw[k]); free = r3(rest - sum(Object.values(amt))); }
  amt.free = free;
  const pots = POTS.map(P => ({...P, pct: potPct(c, P), fix: isFix(c, P) ? c[fk(P)] : 0, amt: amt[P.k]}));
  const costs = r3(fuel + amt.maint + amt.fixed);

function agg(list){
  const a = {n: 0, ca: 0, km: 0, kmCa: 0, noKm: 0, rides: 0, min: 0, costs: 0, save: 0, free: 0, tips: 0};
  for(const s of list){
    const r = split(s);
    a.n++; a.ca += r.ca; a.km += r.km; a.rides += s.rides.length; a.min += s.workMin;
    a.costs += r.costs; a.save += r.save; a.free += r.free; a.tips += r.tips;

const openPause = () => cur && cur.pauses.find(p => !p.b);

function guessEndKm(c){

/* total km / km with clients, median of the last 20 shifts that have both (1.8 until there are 3) */
function kmRatio(){
  const rs = services.filter(s => hasKm(s)).map(s => split(s)).filter(x => x.km > 0 && x.paidKm > 0).map(x => x.km / x.paidKm).slice(-20).sort((a, b) => a - b);
  return {v: rs.length >= 3 ? Math.min(4, Math.max(1, rs[Math.floor(rs.length / 2)])) : 1.8, n: rs.length};
}
/* live figures of the open shift (estimates are labelled as such) */
function liveCard(){
  const now = Date.now(), work = workMs(cur, now), brk = pauseMs(cur, now), span = Math.max(0, now - cur.t0), h = work / 3.6e6;
  const ca = rsum(cur.rides), n = cur.rides.length, paid = sum(cur.rides.filter(r => r.km != null).map(r => r.km));
  const kr = kmRatio(), estKm = paid * kr.v, fuel = estKm * REAL.fuel, costs = estKm * (REAL.fuel + REAL.maint);
  const tips = sum(cur.rides.filter(r => r.lo != null).map(r => Math.max(0, r.p - r.lo)));
  const d30 = dayKey(now - 30 * 864e5), prev = services.filter(x => x.date >= d30), P = agg(prev), ph = P.min / 60;
  const cmp = prev.length >= 3 ? `<div class="lbl2" style="margin-top:14px">Comparé à ta moyenne (${prev.length} services, 30 j)</div><div style="margin-top:4px">
      ${srow('Revenu par heure', `${h > 0 ? dt3(ca / h) : '—'} <span class="mut">vs ${ph > 0 ? dt3(P.ca / ph) : '—'}</span>`)}
      ${srow('Revenu par service', `${dt3(ca)} <span class="mut">vs ${dt3(P.ca / P.n)}</span> ${P.ca > 0 ? `<span class="${ca >= P.ca / P.n ? 'up' : 'down'}">${Math.round(ca / (P.ca / P.n) * 100)} %</span>` : ''}`)}</div>` : '';
  return `<div class="card"><div class="lbl2">Ce service en direct</div>
    <div class="stats num">
      <div class="stat"><div class="lbl2">Revenu</div><b>${dt3(ca)}</b></div>
      <div class="stat"><div class="lbl2">Courses</div><b>${n}</b></div>
      <div class="stat"><div class="lbl2">DT / heure</div><b>${h > 0.05 ? dt3(ca / h) : '—'}</b></div>
      <div class="stat"><div class="lbl2">Travail</div><b>${durMin(work / 6e4)}</b></div>
      <div class="stat"><div class="lbl2">Pauses</div><b>${durMin(brk / 6e4)}</b></div>
      <div class="stat"><div class="lbl2">Par course</div><b>${n ? dt3(ca / n) : '—'}</b></div></div>
    <div style="margin-top:8px">
      ${srow('Temps depuis le début', durMin(span / 6e4))}
      ${srow('Km avec client (compteur)', paid.toFixed(1) + ' km')}
      ${srow('Km total estimé', paid > 0 ? '≈ ' + estKm.toFixed(0) + ' km' : '—')}
      ${srow('Km à vide estimé', paid > 0 ? '≈ ' + Math.max(0, estKm - paid).toFixed(0) + ' km' : '—')}
      ${srow('Essence estimée', paid > 0 ? '≈ ' + dt3(fuel) + ' DT' : '—')}
      ${srow('Coûts moto estimés (essence + entretien)', paid > 0 ? '≈ ' + dt3(costs) + ' DT' : '—')}
      ${srow('Net estimé', paid > 0 ? '≈ ' + dt3(ca - costs) + ' DT' : '—')}
      ${tips > 0 ? srow('Pourboires', dt3(tips) + ' DT') : ''}</div>
    <div class="hint">Estimations : km total = km avec client × ${kr.v.toFixed(2)} (${kr.n >= 3 ? 'médiane de tes ' + kr.n + ' derniers services' : 'valeur par défaut, pas encore assez de services'}), coûts ${dt3(REAL.fuel + REAL.maint)} DT/km.</div>
    ${cmp}</div>`;
}
function notesCard(list, editable){
  if(!list.length && !editable) return '';
  return `<div class="card"><div class="flexb"><div class="lbl2">Notes et incidents</div>${editable ? '<button class="chip acc" id="addNote">+ Note</button>' : ''}</div>
    ${list.length ? list.slice().reverse().map((x, i) => `<div class="note ${x.type}"><b>${hm(x.ts)} · ${x.type === 'incident' ? 'Incident' : 'Note'}</b>${esc(x.text)}${editable ? `<button class="link" data-nrm="${list.length - 1 - i}" style="display:inline;margin:0 0 0 8px;padding:0">retirer</button>` : ''}</div>`).join('') : '<div class="hint">Une panne, un contrôle, une remarque ? Note-le ici.</div>'}</div>`;
}
function addNote(){
  const el = openModal(`<h2>Ajouter une note</h2>
    <div class="seg2" style="margin-top:10px"><button data-ty="note" class="on">Note</button><button data-ty="incident">Incident</button></div>
    <textarea id="nTxt" class="inp" rows="3" maxlength="200" style="font-size:16px;font-weight:600;resize:none" placeholder="ex. crevaison, contrôle de police, pluie…"></textarea>
    <div class="row"><button class="btn sec" data-close>Annuler</button><button class="btn pri" id="nOk">AJOUTER</button></div>`);
  let ty = 'note';
  el.querySelectorAll('[data-ty]').forEach(b => b.onclick = () => { ty = b.dataset.ty; el.querySelectorAll('[data-ty]').forEach(x => x.classList.toggle('on', x === b)); });
  el.querySelector('#nOk').onclick = () => {
    const t = el.querySelector('#nTxt').value.trim(); if(!t) return toast('Écris la note');
    cur.notes = cleanNotes((cur.notes || []).concat([{ts: Date.now(), type: ty, text: t}])); saveCur(); closeTop(); renderCaisse(); toast('Note ajoutée');
  };
  setTimeout(() => el.querySelector('#nTxt').focus(), 100);
}
function renderCaisse(){
  if(!running) closeStale(Date.now());
  const d = new Date(), m = $('caisseBody');
  $('cDate').textContent = JOURS_L[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()];
  const top = todoCard() + importCard();
  if(!cur){
    const last = store.get('lastKm', null);
    m.innerHTML = top + `
      <div class="card">
        <div class="lbl2">Nouveau service</div>
        <div class="field" style="margin-top:12px">
          <div class="sub" style="margin:0 0 8px">Kilométrage au compteur de la moto</div>
          <input id="startKm" class="inp big num" inputmode="numeric" placeholder="ex. 12500" value="${last != null ? last : ''}">
        </div>
        ${last != null ? `<div class="hint" style="margin-top:-4px">Fin du dernier service : ${km(last)} km</div>` : ''}
        <button class="btn go" id="goShift">COMMENCER LE SERVICE</button>
      </div>
      <button class="item" onclick="showPage('dash')"><div class="t"><b>Ton argent</b><small>Gagné, à mettre de côté, libre : voir le tableau de bord</small></div><div class="v" style="color:var(--amber);font-size:20px">›</div></button>
      ${services.length ? '' : `<div class="card"><div class="lbl2">Comment ça marche</div><ol class="steps">
        <li><b>Au départ</b> : note le kilométrage et appuie sur Commencer.</li>
        <li><b>Chaque course du compteur</b> s'ajoute toute seule à ton service, avec le montant reçu.</li>
        <li><b>Pause</b> pour manger : le temps de pause n'est pas compté.</li>
        <li><b>À la fin</b> : km d'arrivée. Le bilan te dit combien garder pour l'essence, l'entretien, l'épargne, et combien tu peux dépenser.</li></ol></div>`}`;
    $('goShift').onclick = () => {
      const v = num($('startKm').value);
      if(!(v >= 0)){ toast('Entre le kilométrage du compteur'); $('startKm').focus(); return; }
      cur = {t0: Date.now(), startKm: v, pauses: [], rides: []};
      saveCur(); renderCaisse(); buzz();
    };
  } else if(!cur.endAt){
    const p = openPause(), pm = pauseMs(cur, Date.now()), n = cur.rides.length, mr = cur.rides.filter(r => r.km != null).length;
    const longH = (Date.now() - cur.t0) / 3.6e6;
    m.innerHTML = top + (longH >= 12 ? `<div class="banner"><b>Service ouvert depuis ${Math.floor(longH)} h.</b> Tu l'as peut-être oublié : termine-le pour que tes chiffres restent justes.</div>` : '') + `
      ${cur.auto ? `<div class="banner"><b>Service démarré à ta première course (${hm(cur.t0)}).</b><br>Vérifie le kilométrage de départ :
        <div class="addrow"><input id="autoKm" class="inp num" inputmode="numeric" placeholder="km au départ" value="${cur.startKm != null ? cur.startKm : ''}"><button class="btn pri sm" id="autoOk">OK</button></div></div>` : ''}
      <div class="card center">
        <span class="pill ${p ? 'pause' : 'run'}"><span class="dot"></span>${p ? 'EN PAUSE' : 'EN SERVICE'}</span>
        <div class="timer num" id="timer">${clock(workMs(cur, Date.now()))}</div>
        <div class="meta">Début ${hm(cur.t0)} · Départ ${cur.startKm != null ? km(cur.startKm) + ' km' : '—'}${pm >= 60000 ? ' · Pauses ' + durMin(pm / 60000) : ''}</div>
        <button class="btn sec" id="pauseBtn">${p ? '▶ Reprendre le travail' : '❚❚ Pause'}</button>
      </div>
      <div class="card">
        <div class="flexb">
          <div><div class="lbl2">Courses</div><div class="big2 num">${n} · ${dt3(rsum(cur.rides))} DT</div>
            ${mr ? `<div class="hint" style="margin-top:2px">${mr} avec le compteur${n - mr ? ' · ' + (n - mr) + ' ajoutée' + (n - mr > 1 ? 's' : '') + ' à la main' : ''}</div>` : ''}</div>
          <button class="chip acc" id="addRide">+ Course</button>
        </div>
        <div class="hint">« + Course » pour une course faite sans le compteur. Touche une course pour corriger le montant reçu.</div>
        ${n ? `<div class="rlist">${cur.rides.map((r, i) => ({r, i})).reverse().map(({r, i}) => `<button class="rrow" data-ri="${i}"><span class="num">${r.ts ? hm(r.ts) : '—'}</span>
          <span class="rsrc">${r.km != null ? 'compteur · ' + r.km.toFixed(1) + ' km' : 'sans compteur'}</span><b class="num">${dt3(r.p)}</b></button>`).join('')}</div>` : ''}
      </div>
      <div class="qacts"><button class="chip acc" id="qExp">+ Dépense</button><button class="chip acc" id="qNote">+ Note</button></div>
      ${liveCard()}
      ${notesCard(cur.notes || [], true)}
      <button class="btn pri" id="endShift">TERMINER LE SERVICE</button>
      <button class="link" id="cancelShift">Annuler ce service</button>
      <button class="item" onclick="showPage('dash')"><div class="t"><b>Ton argent</b><small>Gagné, à mettre de côté, libre : voir le tableau de bord</small></div><div class="v" style="color:var(--amber);font-size:20px">›</div></button>`;
    if($('autoOk')) $('autoOk').onclick = () => {
      const v = num($('autoKm').value);
      if(!(v >= 0)){ toast('Entre le kilométrage de départ'); return; }
      cur.startKm = v; delete cur.auto; saveCur(); renderCaisse();
    };
    $('pauseBtn').onclick = () => { const op = openPause(); if(op) op.b = Date.now(); else cur.pauses.push({a: Date.now()}); saveCur(); renderCaisse(); };
    $('addRide').onclick = quickRide;
    $('qExp').onclick = () => editExpense(null);
    $('qNote').onclick = addNote;
    if($('addNote')) $('addNote').onclick = addNote;
    m.querySelectorAll('[data-nrm]').forEach(b => b.onclick = () => { cur.notes.splice(+b.dataset.nrm, 1); saveCur(); renderCaisse(); });
    m.querySelectorAll('[data-ri]').forEach(b => b.onclick = () => editCurRide(+b.dataset.ri));
    $('endShift').onclick = () => {
      const now = Date.now(), op = openPause();
      if(op) op.b = now;
      cur.endAt = now; cur.date = dayKey(cur.t0); cur.workMin = Math.round(workMs(cur, now) / 60000); cur.endKm = guessEndKm(cur); cur.endKmGuess = cur.endKm !== '';
      saveCur(); renderCaisse(); window.scrollTo(0, 0);
    };
    $('cancelShift').onclick = () => ask('Annuler ce service ? Le temps et les courses du service seront retirés (les courses restent dans l\'historique).', 'Oui, annuler', () => { cur = null; saveCur(); renderCaisse(); }, true);
  } else {
    m.innerHTML = top + `<div class="card"><div class="lbl2">Service terminé</div>
      <div class="sub">${hm(cur.t0)} → ${hm(cur.endAt)}. Saisis le kilométrage d'arrivée. Les courses du compteur sont déjà là ; ajoute celles faites sans le compteur.</div></div><div id="formBox"></div>`;
    shiftForm($('formBox'), cur, 'end', v => {
      const s = {id: uid(), ...v, t0: cur.t0, t1: cur.endAt, cfg: {...R}, notes: cleanNotes(cur.notes)};
      services.push(s); persistAll();
      cur = null; saveCur(); renderCaisse(); showBilan(s);
    }, () => { delete cur.endAt; saveCur(); renderCaisse(); });
  }
  bindTop(m);
}
function bindTop(m){
  m.querySelectorAll('[data-todo]').forEach(b => b.onclick = () => { const s = services.find(x => x.id === b.dataset.todo); if(s) editShift(s); });
  const oc = m.querySelector('#openCaisse');
  if(oc) oc.onclick = () => {
    filePending = true;
    if(!(HAS && typeof Android.openCaisse === 'function' && Android.openCaisse())){ filePending = false; toast('Caisse Moto n\'est pas installée sur ce téléphone'); }
  };
  const ic = m.querySelector('#impCaisse'); if(ic) ic.onclick = () => nat('pickImport');
  const il = m.querySelector('#impLater'); if(il) il.onclick = () => { store.set('caisseDone', true); renderCaisse(); };
}
/* shifts closed automatically that still need their odometer readings */
function todoCard(){
  const list = services.filter(s => s.todo);
  if(!list.length) return '';
  return `<div class="banner"><b>${list.length === 1 ? '1 service à compléter' : list.length + ' services à compléter'}</b> : resté ouvert, il a été fermé automatiquement. Il manque le kilométrage.
    ${list.slice(-3).map(s => `<button class="btn sec" data-todo="${s.id}" style="margin-top:8px">Compléter le service du ${shortDay(s.date)}</button>`).join('')}</div>`;
}
/* guided import of the old Caisse Moto app (Android does not let one app read another app's data) */
function importCard(){
  if(store.get('caisseDone', false)) return '';
  return `<div class="card"><div class="lbl2">Tes données de Caisse Moto</div>
    <ol class="steps"><li>Dans <b>Caisse Moto</b> : termine le service en cours, puis <b>Réglages › Sauvegarder (fichier)</b> et enregistre le fichier (par ex. dans Téléchargements).</li>
    <li>Reviens ici, appuie sur <b>Importer</b> et choisis ce fichier. Tous tes services et tes réglages de partage arrivent ici.</li></ol>
    <div class="row"><button class="btn sec" id="openCaisse">Ouvrir Caisse Moto</button><button class="btn pri" id="impCaisse">Importer</button></div>
    <button class="link" id="impLater">Je n'utilisais pas Caisse Moto</button></div>`;
}
function editCurRide(i){
  const r = cur && cur.rides[i]; if(!r) return;
  const el = openModal(`<h2>Course${r.ts ? ' de ' + hm(r.ts) : ''}</h2>
    <div class="sub">${r.km != null ? `Compteur · ${r.km.toFixed(2)} km · prix ${rangeTxt(r.lo ?? r.p, r.hi ?? r.p)} DT` : 'Course sans compteur'}</div>
    <div class="lbl2" style="margin-top:12px">Montant reçu</div>
    ${r.lo != null ? `<div class="paychips">${payChoices(r.lo, r.hi ?? r.lo).map(v => `<button class="num" data-v="${v}">${dt3(v)}</button>`).join('')}</div>` : ''}
    <div class="addrow"><input id="eAmt" class="inp num" inputmode="decimal" value="${dt3(r.p)}"><button class="btn pri sm" id="eOk">OK</button></div>
    <button class="btn del" data-rm>Retirer du service</button>`);
  const set = v => {
    if(!(v > 0 && v < 1000)){ toast('Montant invalide'); return; }
    if(r.cid) setPaid(r.cid, v); else { r.p = r3(v); saveCur(); }
    closeTop(); renderCaisse(); toast('Montant enregistré');
  };
  el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => set(+b.dataset.v));
  el.querySelector('#eOk').onclick = () => set(r3(num(el.querySelector('#eAmt').value)));
  el.querySelector('[data-rm]').onclick = () => ask(`Retirer cette course (${dt3(r.p)} DT) du service ?${r.cid ? '<br><span class="mut">Elle reste dans l\'historique des courses.</span>' : ''}`, 'Retirer', () => {
    const k = cur.rides.indexOf(r); if(k >= 0) cur.rides.splice(k, 1);
    saveCur(); closeTop(); renderCaisse();
  });
}
function quickRide(){
  const el = openModal(`<h2>Course sans compteur</h2><div class="sub">Montant reçu pour une course faite sans le compteur.</div>
    <div class="addrow"><input id="qPrice" class="inp num" inputmode="decimal" placeholder="Prix en DT"><button class="btn pri sm" id="qAdd">Ajouter</button></div>
    <div class="chips">${QUICK.map(v => `<button class="chip num" data-v="${v}">${v}</button>`).join('')}</div>
    <button class="btn sec" data-close>Fermer</button>`);
  const add = v => {
    if(!(v > 0 && v <= 500)){ toast('Prix invalide'); return; }
    cur.rides.push({p: r3(v), ts: Date.now()}); saveCur(); closeTop(); renderCaisse();
    toast('Course ajoutée : ' + dt3(v) + ' DT');
  };
  el.querySelector('#qAdd').onclick = () => add(num(el.querySelector('#qPrice').value));
  el.querySelector('#qPrice').onkeydown = e => { if(e.key === 'Enter') add(num(e.target.value)); };
  el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => add(+b.dataset.v));
}

/* the end-of-shift form, also used to edit a shift or add a forgotten one. d = {date, startKm, endKm, workMin, rides} */
function shiftForm(el, d, mode, onDone, onBack){
  const q = s => el.querySelector(s);
  const wm = d.workMin || 0;
  el.innerHTML = `
    <div class="card">
      ${mode !== 'end' ? `<div class="field"><label class="lbl2">Date</label><input type="date" id="fDate" class="inp" max="${dayKey(Date.now())}" value="${d.date}"></div>` : ''}
      <div class="row">
        <div class="field"><label class="lbl2">Km départ</label><input id="fStart" class="inp num" inputmode="numeric" value="${d.startKm == null ? '' : d.startKm}"></div>
        <div class="field"><label class="lbl2">Km arrivée</label><input id="fEnd" class="inp num" inputmode="numeric" placeholder="compteur" value="${d.endKm == null ? '' : d.endKm}" ${d.endKmGuess ? 'style="border-color:var(--amber)"' : ''}></div>
      </div>
      <div class="kmline" id="fKm"></div>
      <label class="lbl2">Temps de travail (sans les pauses)</label>
      <div class="row" style="margin-top:6px">
        <div class="unitbox"><input id="fH" class="inp num" inputmode="numeric" value="${Math.floor(wm / 60)}"><span>h</span></div>
        <div class="unitbox"><input id="fM" class="inp num" inputmode="numeric" value="${wm % 60}"><span>min</span></div>
      </div>
    </div>
    <div class="card">
      <div class="flexb"><div class="lbl2">Courses</div><div id="fTot" class="num"></div></div>
      <div class="addrow"><input id="fPrice" class="inp num" inputmode="decimal" placeholder="Course sans compteur (DT)"><button class="btn pri sm" id="fAdd">Ajouter</button></div>
      <div class="chips quick">${QUICK.map(v => `<button class="chip num" data-v="${v}">${v}</button>`).join('')}</div>
      <div class="chips" id="fRides"></div>
    </div>
    <button class="btn pri" id="fSave">${mode === 'end' ? 'VOIR LE BILAN' : 'ENREGISTRER'}</button>
    <button class="btn sec" id="fBack">${mode === 'end' ? 'Reprendre le service' : 'Annuler'}</button>`;
  const persist = () => { if(mode === 'end') saveCur(); };
  const guessNote = () => d.endKmGuess ? `<div class="hint" style="margin:-6px 0 10px;color:var(--amber)">Km d'arrivée estimé par l'application : vérifie le compteur de la moto et corrige si besoin.</div>` : '';
  const kmLine = () => {
    const a = num(d.startKm), b = num(d.endKm), L = q('#fKm');
    if(!(a >= 0) || !(b >= 0)) L.innerHTML = '<span class="mut">Entre le kilométrage d\'arrivée au compteur</span>';
    else if(b < a) L.innerHTML = '<span class="red">Le km d\'arrivée est plus petit que le km de départ</span>';
    else L.innerHTML = `= <b>${km(b - a)} km</b> parcourus`;
    L.insertAdjacentHTML('beforeend', guessNote());
  };
  const ridesUi = () => {
    q('#fRides').innerHTML = d.rides.map((r, i) => `<span class="ride num ${r.km != null ? 'm' : ''}">${dt3(r.p)}${r.km != null ? ` <small>${r.km.toFixed(1)} km</small>` : ''}<button data-i="${i}" aria-label="Retirer">×</button></span>`).join('')
      || '<span class="mut" style="font-size:14px">Aucune course pour l\'instant.</span>';
    const n = d.rides.length;
    q('#fTot').innerHTML = `<b>${n}</b> course${n > 1 ? 's' : ''} · <b>${dt3(rsum(d.rides))} DT</b>`;
  };
  const add = v => {
    if(!(v > 0 && v <= 500)){ toast('Prix invalide'); return false; }
    d.rides.push({p: r3(v)}); persist(); ridesUi(); return true;
  };
  q('#fRides').onclick = e => { const b = e.target.closest('button[data-i]'); if(b){ d.rides.splice(+b.dataset.i, 1); persist(); ridesUi(); } };
  q('#fAdd').onclick = () => { const i = q('#fPrice'); if(add(num(i.value))){ i.value = ''; i.focus(); } };
  q('#fPrice').onkeydown = e => { if(e.key === 'Enter') q('#fAdd').click(); };
  q('.quick').onclick = e => { const b = e.target.closest('button[data-v]'); if(b) add(+b.dataset.v); };
  q('#fStart').oninput = e => { d.startKm = e.target.value; persist(); kmLine(); };
  q('#fEnd').oninput = e => { d.endKm = e.target.value; if(d.endKmGuess){ d.endKmGuess = false; e.target.style.borderColor = ''; } persist(); kmLine(); };
  const time = () => { d.workMin = Math.round((num(q('#fH').value) || 0) * 60 + (num(q('#fM').value) || 0)); persist(); };
  q('#fH').oninput = time; q('#fM').oninput = time;
  if(q('#fDate')) q('#fDate').onchange = e => { d.date = e.target.value; };
  q('#fBack').onclick = onBack;
  q('#fSave').onclick = () => {
    const pv = q('#fPrice').value.trim();
    if(pv){ if(!add(num(pv))) return; q('#fPrice').value = ''; }
    const a = num(d.startKm), b = num(d.endKm);
    if(!(a >= 0)){ q('#fStart').focus(); return toast('Entre le km de départ'); }
    if(!(b >= 0)){ q('#fEnd').focus(); return toast('Entre le km d\'arrivée'); }
    if(b < a){ q('#fEnd').focus(); return toast('Le km d\'arrivée doit être plus grand que le km de départ'); }
    time();
    if(!(d.workMin > 0)) return toast('Entre le temps de travail');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date || '')) return toast('Choisis la date');
    if(d.date > dayKey(Date.now())) return toast('La date est dans le futur');
    const go = () => onDone({date: d.date, startKm: a, endKm: b, workMin: d.workMin, rides: d.rides.map(cleanRide).filter(Boolean)});
    const warn = [];
    if(b - a > 500) warn.push(`${km(b - a)} km en un seul service, c'est beaucoup. Vérifie le compteur.`);
    const paidKm = sum(d.rides.filter(r => r.km != null).map(r => r.km));
    if(paidKm > b - a + 1) warn.push(`Les courses du compteur font ${paidKm.toFixed(1)} km, plus que les ${km(b - a)} km du service. Vérifie le kilométrage.`);
    if(!d.rides.length) warn.push('Aucune course saisie.');
    if(warn.length) ask(warn.join('<br>') + '<br><br>Continuer quand même ?', 'Continuer', go); else go();
  };
  kmLine(); ridesUi();
}

/* statistics of one shift, compared with the rider's average over the 30 days before */
function bilanStats(s, r){
  const n = s.rides.length; if(!n) return '';
  const h = s.workMin / 60, mine = r.save + r.free;
  const M = s.rides.filter(x => x.km != null), T2 = s.rides.filter(x => x.ts);
  const trip = id => trips.find(c => c.id === id);
  const rows = [];
  rows.push(['Montant moyen par course', dt3(r.ca / n) + ' DT']);
  if(h > 0) rows.push(['Courses par heure', (n / h).toFixed(1)]);
  if(M.length){
    rows.push(['Distance moyenne (compteur)', (sum(M.map(x => x.km)) / M.length).toFixed(1) + ' km']);
    const best = M.slice().sort((a, b) => b.km - a.km)[0];
    rows.push(['Plus longue course', best.km.toFixed(1) + ' km · ' + dt3(best.p) + ' DT']);
    const waits = M.map(x => trip(x.cid)).filter(Boolean).map(c => +c.waitMin || 0);
    if(waits.length) rows.push(['Attente moyenne', (sum(waits) / waits.length).toFixed(1) + ' min']);
    if(r.paidKm > 0) rows.push(['Reçu par km avec client', dt3(sum(M.map(x => x.p)) / r.paidKm) + ' DT']);
  }
  const RG = s.rides.filter(x => x.lo != null && x.hi != null);
  if(RG.length){
    const tip = RG.filter(x => x.p > x.lo + 0.0005).length;
    rows.push(['Courses avec pourboire', tip + ' / ' + RG.length + ' (' + Math.round(tip / RG.length * 100) + ' %)']);
  }
  rows.push(['Plus grosse course', dt3(Math.max(...s.rides.map(x => x.p))) + ' DT']);
  if(T2.length){
    const hr = {}; T2.forEach(x => { const k = new Date(x.ts).getHours(); hr[k] = (hr[k] || 0) + 1; });
    const bh = Object.entries(hr).sort((a, b) => b[1] - a[1])[0];
    rows.push(['Heure la plus active', bh[0] + ' h – ' + (+bh[0] + 1) + ' h (' + bh[1] + ')']);
    const ts = T2.map(x => x.ts).sort((a, b) => a - b);
    if(ts.length > 1){
      let gap = 0; for(let i = 1; i < ts.length; i++) gap = Math.max(gap, ts[i] - ts[i - 1]);
      rows.push(['Plus longue attente entre 2 courses', durMin(gap / 60000)]);
    }
  }
  // comparison with the average shift of the 30 days before
  const from = dayKey(keyDate(s.date).getTime() - 30 * 864e5);
  const prev = services.filter(x => x !== s && x.date < s.date && x.date >= from);
  let cmp = '';
  if(prev.length >= 2){
    const P = agg(prev), pc = (a, b) => { if(!(b > 0)) return '—'; const v = Math.round((a / b - 1) * 100); return `<span class="${v >= 0 ? 'up' : 'down'}">${v >= 0 ? '▲' : '▼'} ${Math.abs(v)} %</span>`; };
    const ph = P.min / 60;
    cmp = `<div class="lbl2" style="margin-top:14px">Comparé à ta moyenne (${prev.length} services, 30 jours)</div><div style="margin-top:4px">
      ${srow('Chiffre d\'affaires', `${dt3(r.ca)} <span class="mut">vs ${dt3(P.ca / P.n)}</span> ${pc(r.ca, P.ca / P.n)}`)}
      ${srow('Pour toi', `${dt3(mine)} <span class="mut">vs ${dt3((P.save + P.free) / P.n)}</span> ${pc(mine, (P.save + P.free) / P.n)}`)}
      ${h > 0 && ph > 0 ? srow('Par heure', `${dt3(r.ca / h)} <span class="mut">vs ${dt3(P.ca / ph)}</span> ${pc(r.ca / h, P.ca / ph)}`) : ''}
      ${srow('Courses', `${n} <span class="mut">vs ${(P.rides / P.n).toFixed(1)}</span> ${pc(n, P.rides / P.n)}`)}</div>`;
  }
  return `<div class="card"><div class="lbl2">Statistiques du service</div><div style="margin-top:6px">${rows.map(([k, v]) => srow(k, v)).join('')}</div>${cmp}</div>`;
}
/* honest advice: the fixed fuel amount and the maintenance % may not cover the km really ridden */
function advice(s, r){
  const tips = [];
  const fuelReal = r.km * REAL.fuel, maintReal = r.km * REAL.maint;
  const maint = r.pots.find(p => p.k === 'maint').amt;
  if(!r.short && fuelReal > r.fuel + 0.5) tips.push(`Tu as roulé ${km(r.km)} km : l'essence coûte environ <b>${dt3(fuelReal)} DT</b>, plus que les ${dt3(r.fuel)} DT prévus.`);
  if(r.km > 0 && maint < maintReal * 0.7) tips.push(`Pour ${km(r.km)} km, l'entretien réel coûte environ <b>${dt3(maintReal)} DT</b> (tu mets ${dt3(maint)} DT). Si ça arrive souvent, augmente tes prix ou le % entretien.`);
  if(r.meterRides && r.km > 0 && r.paidKm < r.km * 0.4) tips.push(`Plus de la moitié de tes km sont à vide. Les courses longues hors du centre coûtent un retour : vise le haut de la fourchette.`);
  return tips.length ? `<div class="verdict mid"><b>Conseil :</b> ${tips.join('<br>')}</div>` : '';
}

/* ====================================================================
   Argent › Tableau de bord: what you made, what to set aside (and where), what is free to spend
   ==================================================================== */
let dashPer = 'month';
const PERS = {today: 'Jour', week: 'Semaine', month: 'Mois', year: 'Année', all: 'Tout'};
function dateFilter(per){
  const now = new Date(), today = dayKey(now.getTime()), dow = (now.getDay() + 6) % 7;
  const wk = dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow).getTime());
  return {today: d => d === today, week: d => d >= wk && d <= today, month: d => d.slice(0, 7) === today.slice(0, 7),
    year: d => d.slice(0, 4) === today.slice(0, 4), all: () => true}[per] || (() => true);
}
/* what was planned for each reserve (from the shifts' split) and what was actually spent from it */
function planOf(list){
  const pl = {fuel: 0, maint: 0, fixed: 0, save: 0, free: 0};
  list.forEach(sv => { const r = split(sv); pl.fuel += r.fuel; r.pots.forEach(q => { pl[q.k] += q.amt; }); });
  for(const k in pl) pl[k] = r3(pl[k]);
  return pl;
}
function spentOf(list){
  const sp = {fuel: 0, maint: 0, fixed: 0, save: 0, free: 0};
  list.forEach(e => { sp[catOf(e.cat)[2]] += e.amt; });
  for(const k in sp) sp[k] = r3(sp[k]);
  return sp;
}
/* The five numbers, never mixed up:
   revenu (received) · dépenses réelles (paid) · bénéfice réel = revenu − dépenses
   réserves = what is planned for a pot minus what was really spent from it (money put aside is NOT an expense)
   disponible = libre − dépenses "Autre"  (identity: revenu = dépenses + réserves + disponible) */
function ledger(per){
  const f = dateFilter(per), ALL = withLive();
  const MX = mexp(), L = ALL.filter(s => f(s.date)), E = MX.filter(e => f(e.date));
  const A = agg(L), plan = planOf(L), spent = spentOf(E);
  const planAll = planOf(ALL), spentAll = spentOf(MX);
  const res = ['fuel', 'maint', 'fixed', 'save'].map(k => ({k, plan: planAll[k], spent: spentAll[k], bal: r3(planAll[k] - spentAll[k])}));
  const revAll = r3(sum(ALL.map(s => split(s).ca))), expAll = r3(sum(MX.map(e => e.amt)));
  return {L, E, A, plan, spent, exp: r3(sum(E.map(e => e.amt))), res, revAll, expAll,
    reserves: r3(sum(res.map(x => x.bal))), dispo: r3(planAll.free - spentAll.free)};
}
const POT_INFO = {fuel: ['Carburant', 'var(--fuel)', 'pour faire le plein'], maint: ['Entretien', 'var(--maint)', 'vidange, pneus, freins, réparations'],
  fixed: ['Frais fixes', 'var(--fixed)', 'assurance, vignette, téléphone'], save: ['Épargne', 'var(--save)', 'à ne pas toucher'], free: ['Libre', 'var(--free)', 'tes dépenses personnelles']};
function dashData(per){
  const f = dateFilter(per);
  const L = withLive().filter(s => f(s.date)), A = agg(L), SS = L.map(s => split(s));
  const pots = [{k: 'fuel', name: 'Carburant', color: 'var(--fuel)', sub: 'l\'essence des prochains jours', amt: sum(SS.map(x => x.fuel))}]
    .concat(POTS.filter(P => P.k !== 'free').map(P => ({...P, amt: sum(SS.map(x => x.pots.find(q => q.k === P.k).amt))})));
  return {L, A, pots, aside: sum(pots.map(x => x.amt))};
}

/* month-end projection: only after 5 worked days in the last 30, from the average per worked day and how often you work */
function projection(){
  const now = new Date(), today = dayKey(now.getTime()), d30 = dayKey(now.getTime() - 30 * 864e5);
  const L = withLive(), days = {}; L.filter(x => x.date > d30 && x.date <= today).forEach(x => { days[x.date] = (days[x.date] || 0) + split(x).ca; });
  const n = Object.keys(days).length; if(n < 5) return {n};
  const perDay = sum(Object.values(days)) / n, rate = n / 30, last = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const left = last - now.getDate() + (days[today] ? 0 : 1), mo = agg(L.filter(x => x.date.slice(0, 7) === today.slice(0, 7))).ca;
  return {n, perDay, rate, left, mo, end: mo + perDay * rate * left};
}

function dayList(r){ const out = []; for(let d = keyDate(r.from); d <= keyDate(r.to); d.setDate(d.getDate() + 1)) out.push(dayKey(d.getTime())); return out; }
function monthList(r){ const out = []; const a = keyDate(r.from), b = keyDate(r.to); for(let d = new Date(a.getFullYear(), a.getMonth(), 1); d <= b; d.setMonth(d.getMonth() + 1)) out.push(dayKey(d.getTime()).slice(0, 7)); return out; }

function series(r, valOf){

  if(days.length <= 31) return days.map(k => ({l: keyDate(k).getDate(), tl: shortDay(k), ...valOf(x => x === k, k)}));
  return monthList(r).slice(-12).map(mk => ({l: MOIS_C[+mk.slice(5) - 1], tl: MOIS_L[+mk.slice(5) - 1] + ' ' + mk.slice(0, 4), ...valOf(x => x.slice(0, 7) === mk, mk)}));
}

function anaDist({S, C, E, SS}){

function anaProd({r, S, C, A}){
  const days = new Set(S.map(x => x.date)).size, h = A.min / 60;
  const hr = Array.from({length: 24}, () => ({n: 0, dt: 0}));

  let a = hr.findIndex(x => x.n); if(a < 0) a = 6; let b = 23 - [...hr].reverse().findIndex(x => x.n); if(b > 23) b = 22;
  a = Math.min(a, 6); b = Math.max(b, 22);
  const hl = hr.slice(a, b + 1).map((x, i) => ({l: (a + i) + 'h', tl: (a + i) + ' h – ' + (a + i + 1) + ' h', v: r3(x.dt), tip: x.n + ' course(s) · ' + dt3(x.dt) + ' DT'}));
  const wd = JOURS_W.map(() => ({ca: 0, d: new Set()}));
  S.forEach(x => { const i = (keyDate(x.date).getDay() + 6) % 7; wd[i].ca += split(x).ca; wd[i].d.add(x.date); });
  const wl = wd.map((x, i) => ({l: JOURS_W[i], tl: JOURS_L[(i + 1) % 7], v: x.d.size ? r3(x.ca / x.d.size) : 0, tip: x.d.size ? dt3(x.ca / x.d.size) + ' DT en moyenne (' + x.d.size + ' j)' : 'aucun jour'}));
  return `<div class="kpis">
      <div class="kpi"><div class="lbl2">Courses / jour</div><b class="num">${days ? (A.rides / days).toFixed(1) : '—'}</b></div>
      <div class="kpi"><div class="lbl2">DT / heure active</div><b class="num">${h > 0 ? dt3(A.ca / h) : '—'}</b></div>
      <div class="kpi"><div class="lbl2">Durée moyenne</div><b class="num">${C.length ? Math.round(avg(C.map(c => +c.durMin || 0))) + ' min' : '—'}</b></div>

    <div class="card"><div class="lbl2">Heures les plus rentables</div>${C.length ? bars(hl, 3) + chartHint : '<div class="hint">Pas de course du compteur sur la période.</div>'}</div>
    <div class="card"><div class="lbl2">Jours les plus rentables</div>${S.length ? bars(wl) + '<div class="hint">Revenu moyen par jour travaillé.</div>' : '<div class="hint">Aucun service.</div>'}</div>`;
}
function anaFin({r, S, E, A, SS}){
